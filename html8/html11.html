<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1d">
<title>לוח הופעות – הקאמרי (11)</title>
<style>
@font-face { font-family:'Caravan'; src:url('fonts/caravan-90-aaa.woff') format('woff'); font-weight:900; font-style:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Thin.otf') format('opentype'); font-weight:100; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLight.otf') format('opentype'); font-weight:200; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Regular.otf') format('opentype'); font-weight:400; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Black.otf') format('opentype'); font-weight:900; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightCondensed.otf') format('opentype'); font-weight:200; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularCondensed.otf') format('opentype'); font-weight:400; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackCondensed.otf') format('opentype'); font-weight:900; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightSemiCondensed.otf') format('opentype'); font-weight:200; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularSemiCondenced.otf') format('opentype'); font-weight:400; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BoldSemiCondensed.otf') format('opentype'); font-weight:700; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackSemiCondenced.otf') format('opentype'); font-weight:900; font-stretch:semi-condensed; font-display:swap; }
</style>
<style>
:root {
  --bg:        #1a1a1d;
  --red:       #ed2527;
  --red-hover: #c8102e;
  --text:      #ffffff;
  --sep:       #727272;
  --sep-dark:  #454545;
  --link:      #f8d8cf;
  --tag-h:     27px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  background: #0a0a0c;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 32px 0 64px;
}

/* ── Phone frame ── */
.phone-frame {
  width: 375px; height: 812px;
  background: var(--bg);
  border-radius: 28px;
  box-shadow: 0 32px 96px rgba(0,0,0,0.85), 0 0 0 1px #2a2a2e;
  overflow: hidden; position: relative;
  color: var(--text);
  display: flex; flex-direction: column;
}
@media (max-width: 430px) {
  body { background: var(--bg); padding: 0; }
  .phone-frame { border-radius: 0; box-shadow: none; width: 100%; height: 100vh; }
}

/* ── Cameri sidebar logo ── */
.cameri-sidebar {
  position: absolute; top: 0; right: 0;
  width: 43px; height: 120px;
  z-index: 100; overflow: hidden; line-height: 0;
}
.cameri-sidebar img { width: 43px; height: 120px; display: block; object-fit: cover; }

/* ── Header ── */
.header {
  flex-shrink: 0; position: relative; z-index: 10;
}
.header-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; padding-inline-start: 70px; height: 64px;
}
.header-icons-right { display: flex; align-items: center; gap: 14px; }
.header-icons-left  { display: flex; align-items: center; gap: 2px; }
.header-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }
.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: #fff;
  -webkit-tap-highlight-color: transparent; padding: 0;
}
.breadcrumb {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 8px; padding: 0 20px 12px; padding-inline-start: 70px;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.65);
  flex-shrink: 0;
}
.breadcrumb-sep { font-size: 18px; opacity: 0.5; line-height: 1; }

/* ── Month carousel ── */
.month-section { flex-shrink: 0; position: relative; height: 78px; overflow: hidden; z-index: 9; }
.month-track {
  display: flex; align-items: center;
  overflow-x: scroll; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  direction: ltr; cursor: grab; height: 78px;
}
.month-track.dragging { cursor: grabbing; scroll-snap-type: none; }
.month-track::-webkit-scrollbar { display: none; }
.month-spacer { flex-shrink: 0; }
.month-item {
  scroll-snap-align: center; flex-shrink: 0;
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0 16px; direction: rtl;
  font-family: 'Caravan', sans-serif; font-size: 48px; font-weight: 900;
  color: #4b4b4b; letter-spacing: 5.4px;
  cursor: pointer; user-select: none; white-space: nowrap; transition: color 0.18s;
}
.month-item.center { color: #fff; }
.month-day-badge {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed;
  font-size: 19px; letter-spacing: 0; color: rgba(255,255,255,0.82); margin-bottom: 2px;
  opacity: 0; transition: opacity 0.18s ease;
}
.month-item.center .month-day-badge { opacity: 1; }

/* ── Toolbar ── */
.toolbar-row {
  flex-shrink: 0; display: flex; gap: 12px; padding: 14px 20px 10px;
  position: relative; z-index: 1;
}
.toolbar-btn {
  flex: 1; height: 52px; border-radius: 100px;
  background: #454545; border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 18px; letter-spacing: 0.72px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
  position: relative;
}
.toolbar-btn:active { background: #5a5a5a; }
.toolbar-badge {
  position: absolute; top: -7px; right: 10px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--red); display: none;
  pointer-events: none; border: 2.5px solid #454545;
}
.toolbar-reset { flex: none; width: 52px; background: #454545; }

/* ── Shows list ── */
.shows-wrapper { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.shows-list {
  position: absolute; inset: 0; overflow-y: auto;
  padding: 0 0 calc(100px + env(safe-area-inset-bottom, 0px));
  scrollbar-width: none; transition: opacity 0.28s;
}
.shows-list::-webkit-scrollbar { display: none; }
.shows-list.fading { opacity: 0.12; pointer-events: none; }

/* ── Floating sticky day bar (single, overlays top of scroll list) ── */
.sticky-day-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 6;
  pointer-events: none; display: none;
  background: var(--bg);
}

/* ── Day divider (inline, not sticky) ── */
.day-divider {
  background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding: 11px 26px;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 22px; color: #ffffff; letter-spacing: 0.3px;
  white-space: nowrap;
}
.day-divider-line {
  flex: 1; height: 1px; background: #ffffff;
}
.day-divider-text { display: flex; align-items: center; gap: 10px; }
.day-divider-sep {
  font-weight: 400; font-stretch: normal; font-size: 20px;
  opacity: 0.6; line-height: 1;
}

/* ── Show group ── */
.show-group {
  display: flex; flex-direction: column;
  padding: 22px 20px 22px 44px; gap: 12px; position: relative;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.14s;
}
.show-group:not(:last-child)::after {
  content: ''; position: absolute; bottom: 0; left: 20px; right: 20px;
  height: 1px; background: var(--sep-dark);
}
.show-group:active { background: rgba(255,255,255,0.025); }

/* Top row: poster (right) | info (left) */
.show-top-row {
  display: flex; align-items: flex-start; gap: 15px; width: 100%;
}
.show-info {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
}
.category-tag {
  display: inline-flex; align-items: center; height: var(--tag-h);
  padding: 3px 8px 2px; align-self: flex-start;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 15px; letter-spacing: 0.4px; color: #fff1ed; white-space: nowrap; flex-shrink: 0;
}
.show-title {
  font-family: 'Caravan', sans-serif; font-weight: 900;
  font-size: 20px; color: #fff; line-height: 1.05;
  text-align: right; width: 100%; letter-spacing: 0.5px;
}
.show-poster {
  width: 148px; height: 97px; flex-shrink: 0; overflow: hidden;
  background-size: cover; background-position: center; background-color: #1a1a1a;
}

/* ── Meta row: clock+times | pin+hall ── */
.show-meta-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
  align-self: flex-start; /* right in RTL */
}
.show-meta-item {
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 14px; color: #ffffff; letter-spacing: 0.3px;
  direction: ltr; unicode-bidi: isolate;
}
.show-meta-item svg { flex-shrink: 0; }
.show-meta-times { color: #ffffff; }

/* ── Left chevron ── */
.show-chevron {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 40px; color: var(--link);
  direction: ltr; unicode-bidi: isolate; line-height: 1;
  pointer-events: none;
}


/* ── Show link row (from html6) ── */
.show-link-row {
  display: flex; align-items: center; justify-content: center;
}
.show-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 19px; color: var(--link); letter-spacing: 0.72px; padding: 2px 0;
  cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent;
}

/* ── No results ── */
.no-results {
  padding: 48px 30px 56px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.no-results-img {
  width: 140px; height: 140px; object-fit: contain; margin-bottom: 28px;
}
.no-results-title {
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 20px; color: var(--text); line-height: 1.35; margin-bottom: 10px;
}
.no-results-sub {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.5;
}

/* ══════════════════════════════════════════
   OVERLAY + DRAWER
══════════════════════════════════════════ */
.overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.68);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 110;
}
.overlay.visible { opacity: 1; pointer-events: all; }

.drawer {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 80%; border-radius: 30px 30px 0 0; z-index: 120;
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1),
              height 0.36s cubic-bezier(0.32, 0.72, 0, 1);
}
.drawer.open { transform: translateY(0); }
.drawer.date-mode { height: 72%; }
.drawer.date-mode #panelDates .panel-footer { display: none; }
.drawer.date-mode .drawer-handle-wrap { display: none; }

.drawer-panel {
  position: absolute; inset: 0; background: #fff1ed;
  display: flex; flex-direction: column;
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
#drawerMain { transform: translateX(0); }
#panelDates, #panelHatzagot, #panelMore, #panelLangs { transform: translateX(-100%); }
.panel-out { transform: translateX(100%) !important; }
.panel-in  { transform: translateX(0)   !important; }

.drawer-handle-wrap { padding: 14px 0 8px; display: flex; justify-content: center; flex-shrink: 0; }
.drawer-handle { width: 56px; height: 6px; background: #1a1a1d; opacity: 0.7; border-radius: 3px; }

.drawer-header {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  padding: 4px 24px 18px; flex-shrink: 0;
}
.drawer-title { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 16px; color: #1a1a1d; }
.drawer-clear { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 16px; color: rgba(42,42,44,0.4); background: none; border: none; cursor: pointer; padding: 4px 0; -webkit-tap-highlight-color: transparent; }
.drawer-clear:active { color: #ed2527; }
.drawer-body { overflow-y: auto; flex: 1; scrollbar-width: none; }
.drawer-body::-webkit-scrollbar { display: none; }

.filter-row {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  min-height: 80px; padding: 0 24px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.filter-row::after { content: ''; position: absolute; bottom: 0; left: 24px; right: 24px; height: 1px; background: rgba(42,42,44,0.1); }
.filter-row:active { background: rgba(42,42,44,0.04); }
.filter-row-content { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex: 1; min-width: 0; }
.filter-row-label { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed; font-size: 22px; color: #1a1a1d; transition: font-size 0.18s, color 0.18s, font-weight 0.18s; }
.filter-row.active .filter-row-label { font-size: 13px; font-weight: 400; color: rgba(42,42,44,0.5); }
.filter-row-values { display: none; overflow: hidden; white-space: nowrap; font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed; font-size: 17px; color: #1a1a1d; }
.filter-row.active .filter-row-values { display: block; }
.filter-row-chevron { font-size: 22px; color: rgba(42,42,44,0.38); flex-shrink: 0; line-height: 1; margin-right: 14px; display: inline-block; direction: ltr; unicode-bidi: isolate; }

.drawer-x-btn {
  position: absolute; left: 50%;
  bottom: calc(80% + 20px);
  transform: translateX(-50%) translateY(16px);
  width: 56px; height: 56px; border-radius: 50%;
  background: #fff; border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 130;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, bottom 0.36s cubic-bezier(0.32,0.72,0,1), transform 0.36s cubic-bezier(0.32,0.72,0,1);
  -webkit-tap-highlight-color: transparent;
}
.drawer-x-btn.open { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
.drawer-x-btn.date-mode { bottom: calc(72% + 22px); }

.drawer-footer { flex-shrink: 0; padding: 12px 20px 28px; }
.apply-btn {
  width: 100%; height: 64px; background: #ed2527; color: #fff;
  border: none; font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 24px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.apply-btn:active { background: #c8102e; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 16px; flex-shrink: 0;
  border-bottom: 1px solid rgba(42,42,44,0.1);
}
.panel-back { font-size: 26px; line-height: 1; color: #1a1a1d; background: none; border: none; cursor: pointer; padding: 0 4px; -webkit-tap-highlight-color: transparent; flex-shrink: 0; unicode-bidi: isolate; direction: ltr; }
.panel-title { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed; font-size: 22px; color: #1a1a1d; flex: 1; text-align: center; }
.panel-clear { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 15px; color: rgba(42,42,44,0.4); background: none; border: none; cursor: pointer; padding: 4px 0; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.panel-clear:active { color: #ed2527; }
.panel-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
.panel-body::-webkit-scrollbar { display: none; }
.panel-footer { flex-shrink: 0; padding: 12px 20px 28px; }

.panel-search {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 28px 30px 14px; direction: rtl;
}
.panel-search::after { content: ''; position: absolute; bottom: 0; left: 30px; right: 30px; height: 1.5px; background: #1a1a1d; }
.panel-search-input {
  flex: 1; border: none; outline: none;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 17px; color: #1a1a1d; background: transparent; text-align: right; direction: rtl;
}
.panel-search-input::placeholder { color: rgba(42,42,44,0.55); }

.selected-chips-strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 30px; border-bottom: 1px solid rgba(42,42,44,0.08); }
.selected-chips-strip:empty { display: none; }
.selected-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: #2a2a2c; color: #fff1ed; border-radius: 20px; padding: 5px 10px 5px 12px;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 14px;
  cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.selected-chip-x { font-size: 15px; opacity: 0.6; }

.checklist-row {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 16px 30px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.checklist-row::after { content: ''; position: absolute; bottom: 0; left: 30px; right: 30px; height: 1px; background: rgba(42,42,44,0.06); }
.checklist-row:last-child::after { display: none; }
.checklist-row:active { background: rgba(42,42,44,0.03); }
.checklist-label { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 18px; color: #1a1a1d; flex: 1; }
.checklist-row.selected .checklist-label { font-weight: 700; }
.checklist-check { width: 22px; text-align: center; font-size: 14px; flex-shrink: 0; color: rgba(42,42,44,0.18); }
.checklist-row.selected .checklist-check { color: #ed2527; }

/* ── Date picker ── */
.big-cal-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 28px; }
.big-cal-btn { font-size: 30px; color: #1a1a1d; line-height: 1; background: none; border: none; cursor: pointer; padding: 8px; -webkit-tap-highlight-color: transparent; }
.big-cal-btn:active { opacity: 0.5; }
.big-cal-month-display { display: inline-flex; align-items: baseline; gap: 3px; }
.big-cal-month-name { font-family: 'Caravan', sans-serif; font-weight: 900; font-size: 48px; color: #1a1a1d; line-height: 1; letter-spacing: 2px; }
.big-cal-year-badge { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed; font-size: 17px; color: #1a1a1d; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; padding: 0 8px 8px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: rgba(42,42,44,0.32); padding: 0 0 8px; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 400; color: #1a1a1d; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
.cal-num { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; transition: background 0.1s; }
.cal-day.other-month { color: rgba(42,42,44,0.18); pointer-events: none; }
.cal-day.past { color: rgba(42,42,44,0.28); pointer-events: none; }
.cal-day:not(.past):not(.other-month) { font-weight: 700; }
.cal-day.selected .cal-num { background: #ed2527; color: #fff; font-weight: 700; }
.cal-day:active:not(.other-month):not(.past) .cal-num { background: rgba(42,42,44,0.08); }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: #ed2527; margin-top: 2px; position: relative; z-index: 1; }
.cal-day.selected .cal-dot { background: rgba(255,255,255,0.8); }
.apply-btn-outline {
  width: 100%; height: 64px; background: transparent;
  border: 1.5px solid #1a1a1d; color: #1a1a1d;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;

function getDowHe(month, day) { return DOW_NAMES[new Date(CAL_YEAR, month, day).getDay()]; }
function formatDate(month, day) { return `${String(day).padStart(2,'0')}.${String(month+1).padStart(2,'0')}`; }

  <path d="M10 8H6M6 8L8.5 5.5M6 8L8.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

// ─── Month carousel ───────────────────────────────────────────────────────────
const monthTrack = document.getElementById('monthTrack');

function buildMonthTrack() {
  const labels = MONTHS.slice().reverse();
  monthTrack.innerHTML = '';
  const lSpacer = document.createElement('div');
  lSpacer.className = 'month-spacer'; lSpacer.id = 'mSpacerL';
  monthTrack.appendChild(lSpacer);
  labels.forEach((label, i) => {
    const realIdx = 11 - i;
    const div = document.createElement('div');
    div.className = 'month-item' + (realIdx === selectedMonth ? ' center' : '');
    div.dataset.idx = realIdx;
    div.innerHTML = `${label}<span class="month-day-badge">${String(CAL_YEAR).slice(2)}</span>`;
    div.addEventListener('click', () => scrollToMonth(realIdx));
    monthTrack.appendChild(div);
  });
  const rSpacer = document.createElement('div');
  rSpacer.className = 'month-spacer'; rSpacer.id = 'mSpacerR';
  monthTrack.appendChild(rSpacer);
  requestAnimationFrame(() => { initSpacersAndScroll(); markCenter(); });
}

function initSpacersAndScroll() {
  const half = monthTrack.offsetWidth / 2;
  document.getElementById('mSpacerL').style.width = half + 'px';
  document.getElementById('mSpacerR').style.width = half + 'px';
  const active = monthTrack.querySelector('.month-item.center');
  if (active) monthTrack.scrollLeft = active.offsetLeft + active.offsetWidth / 2 - half;
}

function markCenter() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    el.classList.toggle('center', el === closest);
  });
}

function getCenterMonthIdx() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  return closest ? +closest.dataset.idx : selectedMonth;
}

function scrollToMonth(m) {
  const item = monthTrack.querySelector(`.month-item[data-idx="${m}"]`);
  if (!item) return;
  const cw = monthTrack.offsetWidth;
  monthTrack.scrollTo({ left: item.offsetLeft + item.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
  requestAnimationFrame(markCenter);
}

let dragDown = false, dragX0 = 0, dragScroll0 = 0;
monthTrack.addEventListener('mousedown', e => {
  dragDown = true; dragX0 = e.pageX; dragScroll0 = monthTrack.scrollLeft;
  monthTrack.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('mouseup', () => {
  if (!dragDown) return; dragDown = false;
  monthTrack.classList.remove('dragging');
  const cw = monthTrack.offsetWidth, mid = monthTrack.scrollLeft + cw / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  if (closest) monthTrack.scrollTo({ left: closest.offsetLeft + closest.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
});
window.addEventListener('mousemove', e => {
  if (!dragDown) return; monthTrack.scrollLeft = dragScroll0 - (e.pageX - dragX0);
});
monthTrack.addEventListener('scroll', () => {
  markCenter();
  clearTimeout(debounceTimer);
  document.getElementById('showsList').classList.add('fading');
  debounceTimer = setTimeout(() => {
    const m = getCenterMonthIdx();
    if (m !== selectedMonth) { selectedMonth = m; activeRangeStart = null; activeRangeEnd = null; }
    updateBadge(); renderShows();
    document.getElementById('showsList').classList.remove('fading');
  }, 800);
}, { passive: true });

// ─── Show rendering ───────────────────────────────────────────────────────────
function getFilteredShows(month, rStart, rEnd, types, langs) {
  let s = ALL_SHOWS.filter(x => x.month === month);
  if (rStart && rEnd) s = s.filter(x => x.day >= rStart && x.day <= rEnd);
  else if (rStart)    s = s.filter(x => x.day === rStart);
  if (types.size) s = s.filter(x => types.has(x.tag));
  if (langs.size) s = s.filter(x => x.times.some(t => t.subtitles && langs.has(t.subtitles)));
  return s;
}

function buildTimeBtns(times) {
  return times.map(t => {
    if (t.subtitles) {
      const label = (SUBS_LABELS[t.subtitles] || t.subtitles).replace('\n','<br>');
      return `<button class="time-btn">
        <span class="time-btn-subs"><span class="time-btn-subs-text">${label}</span></span>
        <span class="time-btn-divider"></span>
        <span class="time-btn-time">${t.time}</span>
      </button>`;
    }
    return `<button class="time-btn"><span class="time-btn-time">${t.time}</span></button>`;
  }).join('');
}

function renderShows() {
  const list   = document.getElementById('showsList');
  const shows  = getFilteredShows(selectedMonth, activeRangeStart, activeRangeEnd, activeTypes, activeLangs);

  if (!shows.length) {
    list.innerHTML = `<div class="no-results">
      <img class="no-results-img" src="https://www.figma.com/api/mcp/asset/51c6936a-54d4-4f93-88c5-b977567c3ada" alt="">
      <div class="no-results-title">לא מצאנו הצגות<br>שעונות לסינונים שבחרת</div>
      <div class="no-results-sub">אפשר לנסות סינונים אחרים</div>
    </div>`;
    return;
  }

  // Group by day
  const byDay = [];
  let lastDay = null;
  shows.forEach(s => {
    if (s.day !== lastDay) { byDay.push({ day: s.day, month: s.month, shows: [] }); lastDay = s.day; }
    byDay[byDay.length - 1].shows.push(s);
  });

  list.innerHTML = byDay.map(group => `
    <div class="day-group">
      <div class="day-divider">
        <div class="day-divider-line"></div>
        <div class="day-divider-text">
          <span>${getDowHe(group.month, group.day)}</span>
          <span class="day-divider-sep">|</span>
          <span>${formatDate(group.month, group.day)}</span>
        </div>
        <div class="day-divider-line"></div>
      </div>
      ${group.shows.map(s => {
        const hall = s.times[0]?.hall || '';
        const timesStr = s.times.map(t => t.time).join(', ');
        const clockSVG = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8V8l2.2 1.6"/></svg>`;
        const pinSVG   = `<svg width="14" height="15" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1C4.79 1 3 2.79 3 5c0 3.5 4 10 4 10s4-6.5 4-10c0-2.21-1.79-4-4-4z"/><circle cx="7" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>`;
        return `
        <div class="show-group">
          <div class="show-top-row">
            <div class="show-poster" style="${s.image?`background-image:url('${encodeURI(s.image)}')`:`background:${POSTER_BG[s.tag]||'#2a2a2e'}`}"></div>
            <div class="show-info">
              <div class="category-tag" style="background:${TAG_COLORS[s.tag]||'#333'}">${s.tag}</div>
              <div class="show-title">${s.title}</div>
              <div class="show-meta-row">
                <div class="show-meta-item"><span class="show-meta-times">${timesStr}</span>${clockSVG}</div>
                ${hall ? `<div class="show-meta-item"><span>${hall}</span>${pinSVG}</div>` : ''}
              </div>
            </div>
          </div>
          <div class="show-chevron">&#x2039;</div>
        </div>`;
      }).join('')}
    </div>`).join('');

  if (window._updateStickyDayBar) window._updateStickyDayBar();
}

// ─── Badges ───────────────────────────────────────────────────────────────────
function updateBadge() {
  const n = activeTypes.size + activeLangs.size;
  document.getElementById('filterBadge').style.display = n ? 'block' : 'none';
  document.getElementById('dateBadge').style.display = activeRangeStart ? 'block' : 'none';
  document.getElementById('btnReset').style.display = (activeRangeStart || n > 0) ? 'flex' : 'none';
}

function buildValuesSummary(items, maxPx) {
  if (!items.length) return '';
  const el = document.createElement('span');
  el.style.cssText = 'position:fixed;top:-999px;left:-999px;white-space:nowrap;font-family:FtOrvany,sans-serif;font-size:17px;font-weight:700;font-stretch:semi-condensed';
  document.body.appendChild(el);
  let shown = [];
  for (let i = 0; i < items.length; i++) {
    const candidate = [...shown, items[i]];
    const remaining = items.length - candidate.length;
    el.textContent = candidate.join(' | ') + (remaining > 0 ? ` | +${remaining}` : '');
    if (el.offsetWidth <= maxPx) { shown = candidate; }
    else {
      const ov = items.length - shown.length;
      document.body.removeChild(el);
      return (shown.length ? shown.join(' | ') + ' | ' : '') + `+${ov}`;
    }
  }
  document.body.removeChild(el);
  return shown.join(' | ');
}

function setFilterRow(rowId, valId, items) {
  const row = document.getElementById(rowId);
  const val = document.getElementById(valId);
  if (items.length) { row.classList.add('active'); val.textContent = buildValuesSummary(items, 270); }
  else { row.classList.remove('active'); val.textContent = ''; }
}

function updateMainDrawerBadges() {
  setFilterRow('rowHatzagot', 'valHatzagot', [...draftTypes].filter(t => TYPES_HATZAGOT.includes(t)));
  setFilterRow('rowMore',     'valMore',     [...draftTypes].filter(t => TYPES_MORE.includes(t)));
  setFilterRow('rowLangs',    'valLangs',    [...draftLangs]);
  const hasFilters = draftTypes.size || draftLangs.size || draftRangeStart;
  document.getElementById('clearBtn').style.visibility = hasFilters ? 'visible' : 'hidden';
}

function updateApplyBtn() {
  const n = draftTypes.size + draftLangs.size;
  document.getElementById('applyBtn').textContent = n ? `סינון (${n})` : 'סינון';
}

// ─── Drawer ───────────────────────────────────────────────────────────────────
function openDrawer(mode) {
  drawerMode = mode || 'filters';
  const drawer = document.getElementById('drawer');
  const xBtn   = document.getElementById('drawerXBtn');
  // sync drafts from active
  draftCalMonth = activeCalMonth; draftRangeStart = activeRangeStart; draftRangeEnd = activeRangeEnd;
  draftTypes = new Set(activeTypes);
  draftLangs = new Set(activeLangs);

  if (mode === 'date') {
    drawer.classList.add('date-mode');
    xBtn.classList.add('date-mode');
    openPanel('panelDates');
    buildBigCalendar();
  } else {
    drawer.classList.remove('date-mode');
    xBtn.classList.remove('date-mode');
    buildHatzagotPanel(); buildMorePanel(); buildLangInline();
    updateMainDrawerBadges(); updateApplyBtn();
  }
  drawer.classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  xBtn.classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('drawerXBtn').classList.remove('open');
  // Reset panel states directly (no goBackToMain — that would be circular in date mode)
  document.getElementById('drawerMain').classList.remove('panel-out');
  ['panelDates','panelHatzagot','panelMore','panelLangs'].forEach(id =>
    document.getElementById(id).classList.remove('panel-in')
  );
}

document.getElementById('btnSinun').addEventListener('click', () => openDrawer('filters'));
document.getElementById('btnDate').addEventListener('click', () => openDrawer('date'));
document.getElementById('overlay').addEventListener('click', closeDrawer);
document.getElementById('drawerXBtn').addEventListener('click', closeDrawer);
document.getElementById('btnReset').addEventListener('click', () => {
  activeRangeStart = null; activeRangeEnd = null;
  activeTypes.clear(); activeLangs.clear();
  updateBadge(); renderShows();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  draftTypes.clear(); draftLangs.clear();
  draftRangeStart = null; draftRangeEnd = null;
  buildHatzagotPanel(); buildMorePanel(); buildLangInline();
  updateMainDrawerBadges(); updateApplyBtn(); buildBigCalendar();
});

document.getElementById('applyBtn').addEventListener('click', () => {
  activeTypes = new Set(draftTypes);
  activeLangs = new Set(draftLangs);
  activeCalMonth = draftCalMonth; activeRangeStart = draftRangeStart; activeRangeEnd = draftRangeEnd;
  updateBadge(); renderShows(); closeDrawer();
});

// ─── Big calendar ─────────────────────────────────────────────────────────────
function buildBigCalendar() {
  const month = draftCalMonth;
  document.getElementById('bigCalMonthName').textContent = MONTHS[month];
  document.getElementById('bigCalYearBadge').textContent = String(CAL_YEAR).slice(2);
  const daysWithShows = new Set(ALL_SHOWS.filter(s => s.month === month).map(s => s.day));
  const firstDow    = new Date(CAL_YEAR, month, 1).getDay();
  const daysInMonth = new Date(CAL_YEAR, month + 1, 0).getDate();
  const prevDays    = new Date(CAL_YEAR, month, 0).getDate();
  const totalCells  = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  const isPast  = (m, d) => m < TODAY_M || (m === TODAY_M && d < TODAY_D);
  const isToday = (m, d) => m === TODAY_M && d === TODAY_D;
  let cells = '';
  for (let i = 0; i < totalCells; i++) {
    if (i < firstDow) {
      cells += `<div class="cal-day other-month"><span class="cal-num">${prevDays - firstDow + i + 1}</span></div>`;
    } else {
      const d = i - firstDow + 1;
      if (d > daysInMonth) {
        cells += `<div class="cal-day other-month"><span class="cal-num">${d - daysInMonth}</span></div>`;
      } else {
        const has = daysWithShows.has(d), past = isPast(month, d), today = isToday(month, d), selected = draftRangeStart === d;
        const cls = ['cal-day', past ? 'past' : (has ? 'has-shows' : ''), today ? 'today' : '', selected ? 'selected' : ''].filter(Boolean).join(' ');
        cells += `<div class="${cls}" data-day="${d}"><span class="cal-num">${d}</span>${today ? '<div class="cal-dot"></div>' : ''}</div>`;
      }
    }
  }
  document.getElementById('bigCalGrid').innerHTML = `<div class="cal-grid">${DOW_HE.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  document.getElementById('bigCalGrid').querySelectorAll('.cal-day:not(.other-month):not(.past)').forEach(el => {
    el.addEventListener('click', () => {
      const d = +el.dataset.day;
      if (drawerMode === 'date') {
        activeCalMonth = draftCalMonth; activeRangeStart = d; activeRangeEnd = null;
        draftRangeStart = d; updateBadge(); renderShows(); closeDrawer();
      } else {
        draftRangeStart = (draftRangeStart === d) ? null : d;
        draftRangeEnd = null; buildBigCalendar(); updateMainDrawerBadges();
      }
    });
  });
}

document.getElementById('bigCalPrev').addEventListener('click', () => { draftCalMonth = draftCalMonth===0?11:draftCalMonth-1; draftRangeStart=null; buildBigCalendar(); updateMainDrawerBadges(); });
document.getElementById('bigCalNext').addEventListener('click', () => { draftCalMonth = draftCalMonth===11?0:draftCalMonth+1; draftRangeStart=null; buildBigCalendar(); updateMainDrawerBadges(); });

document.getElementById('applyDatesBtn').addEventListener('click', () => {
  if (drawerMode === 'date') { activeCalMonth = draftCalMonth; activeRangeStart = draftRangeStart; activeRangeEnd = draftRangeEnd; updateBadge(); renderShows(); closeDrawer(); }
  else goBackToMain();
});

// ─── Checklist builders ───────────────────────────────────────────────────────
function buildChecklist(containerId, types) {
  const list = document.getElementById(containerId);
  list.innerHTML = types.map(t => `<div class="checklist-row${draftTypes.has(t)?' selected':''}" data-type="${encodeURIComponent(t)}"><span class="checklist-check">✓</span><span class="checklist-label">${t}</span></div>`).join('');
  list.querySelectorAll('.checklist-row').forEach(row => row.addEventListener('click', () => {
    const t = decodeURIComponent(row.dataset.type);
    draftTypes.has(t) ? draftTypes.delete(t) : draftTypes.add(t);
    buildHatzagotPanel(); buildMorePanel(); updateMainDrawerBadges(); updateApplyBtn();
  }));
}
function buildHatzagotPanel() { buildChecklist('hatzagotChecklist', TYPES_HATZAGOT); }
function buildMorePanel()     { buildChecklist('moreChecklist',     TYPES_MORE); }

function buildLangInline() {
  const list = document.getElementById('langChecklist');
  list.innerHTML = LANGS.map(l => `<div class="checklist-row${draftLangs.has(l)?' selected':''}" data-lang="${encodeURIComponent(l)}"><span class="checklist-check">✓</span><span class="checklist-label">${l}</span></div>`).join('');
  list.querySelectorAll('.checklist-row').forEach(row => row.addEventListener('click', () => {
    const l = decodeURIComponent(row.dataset.lang);
    draftLangs.has(l) ? draftLangs.delete(l) : draftLangs.add(l);
    buildLangInline(); updateMainDrawerBadges(); updateApplyBtn();
  }));
}

document.getElementById('applyHatzagotBtn').addEventListener('click', () => goBackToMain());
document.getElementById('applyMoreBtn').addEventListener('click', () => goBackToMain());
document.getElementById('applyLangsBtn').addEventListener('click', () => goBackToMain());

// ─── Panel navigation ─────────────────────────────────────────────────────────
function openPanel(panelId) {
  document.getElementById('drawerMain').classList.add('panel-out');
  document.getElementById(panelId).classList.add('panel-in');
}
function goBackToMain() {
  if (drawerMode === 'date') { closeDrawer(); return; }
  document.getElementById('drawerMain').classList.remove('panel-out');
  ['panelDates','panelHatzagot','panelMore','panelLangs'].forEach(id => document.getElementById(id).classList.remove('panel-in'));
}

document.querySelectorAll('.filter-row[data-panel]').forEach(row => {
  row.addEventListener('click', () => {
    const id = row.dataset.panel;
    openPanel(id);
    if (id === 'panelDates')    buildBigCalendar();
    if (id === 'panelHatzagot') buildHatzagotPanel();
    if (id === 'panelMore')     buildMorePanel();
    if (id === 'panelLangs')    buildLangInline();
  });
});

['backFromHatzagot','backFromMore','backFromLangs'].forEach(id => {
  document.getElementById(id).addEventListener('click', goBackToMain);
});

// ─── Header + Toolbar proportional scroll + floating day bar ─────────────────
(function() {
  const header  = document.querySelector('.header');
  const toolbar = document.getElementById('toolbarRow');
  const list    = document.getElementById('showsList');
  const bar     = document.getElementById('stickyDayBar');
  const barText = document.getElementById('stickyDayText');

  let lastST        = 0;
  let headerOffset  = 0;
  let toolbarOffset = 0;

  function updateStickyDayBar() {
    const dividers = list.querySelectorAll('.day-divider');
    const st = list.scrollTop;
    let current = null;
    for (const d of dividers) {
      if (d.offsetTop < st) current = d;
      else break;
    }
    if (current) {
      barText.innerHTML = current.querySelector('.day-divider-text').innerHTML;
      bar.style.display = 'flex';
    } else {
      bar.style.display = 'none';
    }
  }

  list.addEventListener('scroll', () => {
    const st    = Math.max(0, list.scrollTop);
    const delta = st - lastST;
    lastST = st;

    const maxH = header.offsetHeight;
    const maxT = toolbar.offsetHeight;
    headerOffset  = Math.max(0, Math.min(maxH, headerOffset  + delta));
    toolbarOffset = Math.max(0, Math.min(maxT, toolbarOffset + delta));

    header.style.marginTop  = headerOffset  ? `-${headerOffset}px`  : '';
    header.style.transform  = headerOffset  ? `translateY(-${headerOffset}px)` : '';
    toolbar.style.marginTop = toolbarOffset ? `-${toolbarOffset}px` : '';
    toolbar.style.transform = toolbarOffset ? `translateY(-${toolbarOffset}px)` : '';

    updateStickyDayBar();
  }, { passive: true });

  // Expose so renderShows can trigger an update after content changes
  window._updateStickyDayBar = updateStickyDayBar;
})();

// ─── Init ─────────────────────────────────────────────────────────────────────
buildMonthTrack();
renderShows();
</script>
