<head>

<title>לוח הופעות – הקאמרי (12)</title>
<style>
@font-face { font-family:'Caravan'; src:url('fonts/caravan-90-aaa.woff') format('woff'); font-weight:900; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Thin.otf') format('opentype'); font-weight:100; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLight.otf') format('opentype'); font-weight:200; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Regular.otf') format('opentype'); font-weight:400; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Black.otf') format('opentype'); font-weight:900; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightCondensed.otf') format('opentype'); font-weight:200; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularCondensed.otf') format('opentype'); font-weight:400; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackCondensed.otf') format('opentype'); font-weight:900; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightSemiCondensed.otf') format('opentype'); font-weight:200; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularSemiCondenced.otf') format('opentype'); font-weight:400; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BoldSemiCondensed.otf') format('opentype'); font-weight:700; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackSemiCondenced.otf') format('opentype'); font-weight:900; font-stretch:semi-condensed; font-display:swap; }

<style>
:root {
  --bg:        #1a1a1d;
  --red:       #ed2527;
  --red-hover: #c8102e;
  --text:      #ffffff;
  --sep:       #727272;
  --sep-dark:  #454545;
  --link:      #f8d8cf;
  --tag-h:     27px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  background: #0a0a0c;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 32px 0 64px;
}

/* ── Phone frame ── */
.phone-frame {
  width: 375px; height: 812px;
  --phone-frame-width: 375px;  /* used by .float-filter for centering math */
  background: var(--bg);
  border-radius: 28px;
  box-shadow: 0 32px 96px rgba(0,0,0,0.85), 0 0 0 1px #2a2a2e;
  overflow: hidden; position: relative;
  color: var(--text);
  display: flex; flex-direction: column;
}
@media (max-width: 430px) {
  body { background: var(--bg); padding: 0; }
  .phone-frame { border-radius: 0; box-shadow: none; width: 100%; height: 100vh; --phone-frame-width: 100vw; }
}

/* ── Cameri sidebar logo ── */
.cameri-sidebar {
  position: absolute; top: 0; right: 0;
  width: 43px; height: 120px;
  z-index: 100; overflow: hidden; line-height: 0;
}
.cameri-sidebar img { width: 43px; height: 120px; display: block; object-fit: cover; }

/* ── Header — lives inside #collapsible ── */
.header { position: relative; }
.header-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; padding-inline-start: 70px; height: 64px;
}
.header-icons-right { display: flex; align-items: center; gap: 14px; }
.header-icons-left  { display: flex; align-items: center; gap: 2px; }
.header-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }
.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: #fff;
  -webkit-tap-highlight-color: transparent; padding: 0;
}
.breadcrumb {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 8px; padding: 0 20px 12px; padding-inline-start: 70px;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.65);
  flex-shrink: 0;
}
.breadcrumb-sep { font-size: 18px; opacity: 0.5; line-height: 1; }

/* ── Month carousel ── */
/* Single blurred glass surface — wraps header + month as one unit */
.glass-header {
  position: sticky; top: 0; z-index: 9;
  isolation: isolate;
}
/* Blur + tint live on a pseudo-element so the mask fades the blur itself */
.glass-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: -86px;
  z-index: -1;
  background:
    linear-gradient(to bottom,
      rgba(26,26,29,0.72) 0%,
      rgba(26,26,29,0.68) calc(100% - 105px),
      rgba(26,26,29,0.55) calc(100% - 80px),
      rgba(26,26,29,0.40) calc(100% - 55px),
      rgba(26,26,29,0.25) calc(100% - 35px),
      rgba(26,26,29,0.12) calc(100% - 22px),
      rgba(26,26,29,0.05) calc(100% - 14px),
      rgba(26,26,29,0) 100%);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  -webkit-mask-image: linear-gradient(to bottom,
    #000 0%,
    #000 calc(100% - 105px),
    rgba(0,0,0,0.92) calc(100% - 80px),
    rgba(0,0,0,0.75) calc(100% - 55px),
    rgba(0,0,0,0.50) calc(100% - 35px),
    rgba(0,0,0,0.25) calc(100% - 22px),
    rgba(0,0,0,0.08) calc(100% - 14px),
    transparent 100%);
  mask-image: linear-gradient(to bottom,
    #000 0%,
    #000 calc(100% - 105px),
    rgba(0,0,0,0.92) calc(100% - 80px),
    rgba(0,0,0,0.75) calc(100% - 55px),
    rgba(0,0,0,0.50) calc(100% - 35px),
    rgba(0,0,0,0.25) calc(100% - 22px),
    rgba(0,0,0,0.08) calc(100% - 14px),
    transparent 100%);
  pointer-events: none;
}
.month-section { flex-shrink: 0; height: 78px; overflow: hidden; }
.month-track {
  display: flex; align-items: center;
  overflow-x: scroll; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  direction: ltr; cursor: grab; height: 78px;
}
.month-track.dragging { cursor: grabbing; scroll-snap-type: none; }
.month-track::-webkit-scrollbar { display: none; }
.month-spacer { flex-shrink: 0; }
.month-item {
  scroll-snap-align: center; flex-shrink: 0;
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0 16px; direction: rtl;
  font-family: 'Caravan', sans-serif; font-size: 48px; font-weight: 900;
  color: #4b4b4b; letter-spacing: 5.4px;
  cursor: pointer; user-select: none; white-space: nowrap; transition: color 0.18s;
}
.month-item.center { color: #fff; }
.month-day-badge {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed;
  font-size: 19px; letter-spacing: 0; color: rgba(255,255,255,0.82); margin-bottom: 2px;
  opacity: 0; transition: opacity 0.18s ease;
}
.month-item.center .month-day-badge { opacity: 1; }

/* ── Toolbar ── */
.toolbar-row {
  flex-shrink: 0; display: grid; grid-template-columns: 1fr;
  gap: 12px; padding: 14px 20px 10px;
  background: transparent;
}
.toolbar-btn {
  flex: 1 1 0; min-width: 0; box-sizing: border-box;
  width: 100%;
  height: 44px; border-radius: 100px;
  background: #454545; border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 18px; letter-spacing: 0.72px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
  position: relative;
}
.toolbar-btn:active { background: #5a5a5a; }
.toolbar-badge {
  position: absolute; top: -7px; left: 10px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--red); display: none;
  pointer-events: none; border: 2.5px solid #454545;
}
#btnSinun .toolbar-badge {
  left: 10px;
  right: auto;
}
.filter-capsule {
  padding-inline: 12px;
}
.toolbar-content {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  transition: transform 0.15s ease;
}
.filter-capsule .toolbar-content {
  flex-direction: row-reverse;
}
.filter-capsule.has-reset .toolbar-content {
  transform: translateX(18px);
}
.toolbar-reset {
  position: absolute;
  left: 5px;
  top: 5px;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.toolbar-reset:active { background: var(--red-hover); }
.toolbar-reset svg { width: 14px; height: 14px; }

/* ── Floating filter capsule ───────────────────────────────────────────────
   ANIMATION PRINCIPLES APPLIED:
   - Single easing (Material standard) and single duration (0.35s) for all motion.
   - Position via TRANSFORM only (compositor-friendly, no layout reflow per frame).
   - Explicit pixel widths in every state (134 / 156 / 48px) so width can interpolate.
   - CSS variable handles centering math; works on desktop (375px) and mobile (100vw).
   - Label fades via opacity only; icon stays positionally stable thanks to flex-shrink:0.
*/
.float-filter {
  position: absolute; bottom: 28px;
  left: 0;
  width: 120px;  /* hugs content: 76px content + 22px each side */
  height: 48px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 0;
  background: #454545; color: #ffffff;
  border: none; border-radius: 999px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900;
  font-stretch: semi-condensed; font-size: 18px; letter-spacing: 0.72px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  z-index: 50;
  /* Note: NO overflow:hidden here — the X badge needs to overflow at the corner.
     Label clipping is handled on .float-filter-label itself. */
  transform: translateX(16px);  /* parked on the left from page load; only width changes on scroll */
  transition:
    transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    width     0.35s cubic-bezier(0.4, 0, 0.2, 1),
    gap       0.35s cubic-bezier(0.4, 0, 0.2, 1),
    padding   0.35s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform, width;
}
.float-filter:active { background: #5a5a5a; }
.float-filter-icon {
  display: inline-flex; align-items: center; flex-shrink: 0;
  transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.float-filter-label {
  display: inline-block; white-space: nowrap;
  overflow: hidden;
  max-width: 200px; opacity: 1;
  transition:
    max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
    opacity   0.2s  cubic-bezier(0.4, 0, 0.2, 1);
}

/* X is a corner badge attached to the pill's top-left, slightly overlapping the
   rounded corner — sticks out 8px above and to the left for the classic badge look. */
.float-filter-reset {
  position: absolute; top: -8px; left: -8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--red); color: #ffffff;
  border: none;
  display: inline-flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;  /* hidden by default, fades in via .has-reset */
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.float-filter-reset:active { background: var(--red-hover); }
.float-filter.has-reset .float-filter-reset { opacity: 1; pointer-events: auto; }
.float-filter-reset svg { width: 12px; height: 12px; }

/* .has-reset no longer affects pill layout — the X is now a corner badge
   floating OUTSIDE the pill, so it doesn't take inline space. Only .has-reset's
   effect now is showing/hiding the X (handled via opacity on .float-filter-reset). */

/* Collapsed: 48px perfect circle (same height as expanded pill so the button
   doesn't visually "shrink" vertically — only horizontally on scroll). */
.float-filter.collapsed {
  width: 48px;
  height: 48px;
  padding: 0;
  gap: 0;
  transform: translateX(16px);
}
.float-filter.collapsed .float-filter-label { max-width: 0; opacity: 0; }
/* .collapsed.has-reset no longer needs special width — the X badge floats at the
   corner of the 48px collapsed circle, no longer taking pill-interior space. */

/* ── Shows list ── */
.content-scroller {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  min-height: 0; scrollbar-width: none; position: relative;
}
.content-scroller::-webkit-scrollbar { display: none; }
.shows-list {
  padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  transition: opacity 0.28s;
}
.shows-list.fading { opacity: 0.12; pointer-events: none; }

/* ── Day divider (editorial, ported from html11.5) ── */
.day-divider {
  background: var(--bg);
  display: flex; align-items: center; gap: 14px;
  padding: 19px 22px 19px;
  font-family: 'FtOrvany', sans-serif; white-space: nowrap;
}

/* ── Sticky day-bar (lives inside glass-header, text updates via JS) ── */
/* Visually identical to the inline .day-divider but with transparent bg
   so it sits on the glass surface. Slightly tighter top padding so it
   sits closer to the toolbar/carousel above. */
.sticky-day-bar {
  display: none;  /* shown by JS once user scrolls past the first day */
  pointer-events: none;
  background: transparent;
  padding-top: 14px;  /* override .day-divider's 19px — 5px tighter */
}
.dd-day {
  font-family: 'Caravan', sans-serif; font-weight: 900; font-size: 30px;
  color: var(--text); line-height: 1; letter-spacing: 1px; flex-shrink: 0;
}
.day-divider-text {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-stretch: semi-condensed; font-size: 13px;
  letter-spacing: 1.5px; color: #b5b9c6; flex-shrink: 0;
}
.day-divider-sep { opacity: 0.4; font-weight: 400; }
.dd-rule { flex: 1; height: 1px; background: var(--sep-dark); }
.day-divider-line {
  flex: 1; height: 1px; background: var(--sep-dark);
}

/* ══════════════════════════════════════════
   SHOW CARD (html11 compact design)
══════════════════════════════════════════ */
.show-group {
  display: flex; flex-direction: row; align-items: flex-start; gap: 16px;
  padding: 27px 22px 27px 22px; position: relative;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.14s;
}
.show-group:not(:last-child)::after {
  content: ''; position: absolute; bottom: 0; left: 22px; right: 22px;
  height: 1px; background: var(--sep-dark);
}
.show-group:active { background: rgba(255,255,255,0.025); }

/* Info column (left of poster in RTL): title, location, buttons */
.show-info {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 8px; padding-top: 2px;
  align-items: flex-end;
}
.category-tag {
  display: inline-flex; align-items: center; height: 19px;
  padding: 2px 6px 1px; align-self: flex-start;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 11px; letter-spacing: 0.4px; color: #fff1ed; white-space: nowrap; flex-shrink: 0;
}
.show-poster {
  width: 74px; height: 104px; flex-shrink: 0; overflow: hidden;
  background-size: cover; background-position: center; background-color: #1a1a1a;
  border-radius: 3px; position: relative;
}
.show-poster .category-tag {
  position: absolute; top: 0; right: 0; align-self: auto;
}
.show-title {
  font-family: 'Caravan', sans-serif; font-weight: 900;
  font-size: 24px; color: #fff; line-height: 1.05;
  text-align: right; width: 100%; letter-spacing: 0.5px;
}
/* ── Meta row: clock+times | pin+hall ── */
.show-meta-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
  align-self: flex-start;
}
.show-meta-item {
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 14px; color: #ffffff; letter-spacing: 0.3px;
  direction: ltr; unicode-bidi: isolate;
}
.show-meta-item svg { flex-shrink: 0; }
.show-meta-times { color: #ffffff; }

/* ── Title row wrapper: anchors chevron to title's vertical center.
   padding-left reserves a 20px gutter for the chevron (~14px glyph + 6px
   minimum gap), forcing long titles to wrap before touching the chevron. */
.show-title-row {
  position: relative; width: 100%; padding-left: 20px;
}

/* ── Left chevron (exact copy from html11.5) ── */
.show-chevron {
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: auto; height: auto; background: none; box-shadow: none; padding: 0;
  font-size: 40px; color: var(--link);
  direction: ltr; unicode-bidi: isolate; line-height: 1; pointer-events: none;
}

/* ── Time buttons (red, from html15) ── */
.show-times {
  display: flex; gap: 8px; align-items: stretch; width: 100%; margin-top: 4px;
}
.time-btn {
  flex: 1 1 0; min-width: 0; overflow: hidden; height: 40px;
  background: rgba(237, 37, 39, 0.8); border: none; color: #ffffff;
  border-radius: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 0 10px; gap: 0;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s; direction: ltr;
}
.time-btn:active { background: var(--red-hover); }
.time-btn-time {
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 19px; letter-spacing: 0.76px; text-align: center; flex: 1; color: #ffffff;
}
.time-btn-subs {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.time-btn-subs-text {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 11px; line-height: 1.15; text-align: center; color: rgba(255,255,255,0.92);
}
.time-btn-divider {
  width: 1px; height: 18px; flex-shrink: 0;
  background: rgba(255,255,255,0.45); margin: 0 4px;
}

/* ── No results / empty day ── */
.no-results {
  padding: 48px 30px 56px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.no-results-img {
  width: 140px; height: 140px; object-fit: contain; margin-bottom: 28px;
}
.no-results-title {
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 20px; color: var(--text); line-height: 1.35; margin-bottom: 10px;
}
.no-results-sub {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.5;
}
.day-empty {
  margin: 8px 26px 24px;
  min-height: 72px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 18px; color: rgba(255,255,255,0.75); letter-spacing: 0.2px;
}

/* ══════════════════════════════════════════
   OVERLAY + DRAWER
══════════════════════════════════════════ */
.overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.68);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 110;
}
.overlay.visible { opacity: 1; pointer-events: all; }

.date-toast {
  position: absolute;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(12px);
  background: rgba(26,26,29,0.94);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 700;
  font-stretch: semi-condensed;
  font-size: 15px;
  line-height: 1;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 150;
  white-space: nowrap;
}
.date-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.drawer {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: calc(80% + env(safe-area-inset-bottom, 0px)); border-radius: 30px 30px 0 0; z-index: 120;
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1),
              height 0.36s cubic-bezier(0.32, 0.72, 0, 1);
}
.drawer.open { transform: translateY(0); }
.drawer.date-mode { height: calc(72% + env(safe-area-inset-bottom, 0px)); }
.drawer.date-mode #panelDates .panel-footer { display: none; }
.drawer.date-mode .drawer-handle-wrap { display: none; }

.drawer-panel {
  position: absolute; inset: 0; background: #fff1ed;
  display: flex; flex-direction: column;
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
#drawerMain { transform: translateX(0); }
#panelDates, #panelHatzagot, #panelMore, #panelLangs { transform: translateX(-100%); }
.panel-out { transform: translateX(100%) !important; }
.panel-in  { transform: translateX(0)   !important; }

.drawer-handle-wrap { padding: 14px 0 8px; display: flex; justify-content: center; flex-shrink: 0; }
.drawer-handle { width: 56px; height: 6px; background: #1a1a1d; opacity: 0.7; border-radius: 3px; }

.drawer-header {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  padding: 4px 24px 18px; flex-shrink: 0;
}
.drawer-title { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 16px; color: #1a1a1d; }
.drawer-clear { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 16px; color: #2a2a2c; background: none; border: none; cursor: pointer; padding: 4px 0; -webkit-tap-highlight-color: transparent; }
.drawer-clear:active { color: #ed2527; }
.drawer-body { overflow-y: auto; flex: 1; scrollbar-width: none; }
.drawer-body::-webkit-scrollbar { display: none; }

.filter-row {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  min-height: 80px; padding: 0 24px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.filter-row::after { content: ''; position: absolute; bottom: 0; left: 24px; right: 24px; height: 1px; background: rgba(42,42,44,0.2); }
.filter-row:active { background: rgba(42,42,44,0.04); }
.filter-row-content { display: flex; flex-direction: column; justify-content: center; gap: 5px; flex: 1; min-width: 0; }
.filter-row-label { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed; font-size: 22px; color: #1a1a1d; transition: font-size 0.18s, color 0.18s, font-weight 0.18s; }
.filter-row.active .filter-row-label { font-size: 15px; font-weight: 400; color: rgba(42,42,44,0.56); }
.filter-row-values { display: none; overflow: hidden; white-space: nowrap; font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed; font-size: 17px; color: #1a1a1d; }
.filter-row.active .filter-row-values { display: block; }
.filter-row-chevron { font-size: 22px; color: rgba(42,42,44,0.56); flex-shrink: 0; line-height: 1; margin-right: 14px; display: inline-block; direction: ltr; unicode-bidi: isolate; }

.drawer-x-btn {
  position: absolute; left: 50%;
  bottom: calc(80% + 20px);
  transform: translateX(-50%) translateY(16px);
  width: 56px; height: 56px; border-radius: 50%;
  background: #fff; border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 130;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, bottom 0.36s cubic-bezier(0.32,0.72,0,1), transform 0.36s cubic-bezier(0.32,0.72,0,1);
  -webkit-tap-highlight-color: transparent;
}
.drawer-x-btn.open { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
.drawer-x-btn.date-mode { bottom: calc(72% + 22px); }

.drawer-footer { flex-shrink: 0; padding: 12px 20px calc(28px + env(safe-area-inset-bottom, 0px)); }
.apply-btn {
  width: 100%; height: 64px; background: #ed2527; color: #fff;
  border: none; font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 24px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.apply-btn:active { background: #c8102e; }
.apply-btn:disabled,
.apply-btn-outline:disabled {
  opacity: 0.28; cursor: default; pointer-events: none;
}

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 16px; flex-shrink: 0;
  border-bottom: 1px solid rgba(42,42,44,0.1);
}
.panel-back { font-size: 26px; line-height: 1; color: #1a1a1d; background: none; border: none; cursor: pointer; padding: 0 4px; -webkit-tap-highlight-color: transparent; flex-shrink: 0; unicode-bidi: isolate; direction: ltr; }
.panel-title { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed; font-size: 22px; color: #1a1a1d; flex: 1; text-align: center; }
.panel-clear { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 15px; color: #2a2a2c; background: none; border: none; cursor: pointer; padding: 4px 0; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.panel-clear:active { color: #ed2527; }
.panel-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
.panel-body::-webkit-scrollbar { display: none; }
.panel-footer { flex-shrink: 0; padding: 12px 20px calc(28px + env(safe-area-inset-bottom, 0px)); }

.panel-search {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 28px 30px 14px; direction: rtl;
}
.panel-search::after { content: ''; position: absolute; bottom: 0; left: 30px; right: 30px; height: 1.5px; background: #1a1a1d; }
.panel-search-input {
  flex: 1; border: none; outline: none;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 17px; color: #1a1a1d; background: transparent; text-align: right; direction: rtl;
}
.panel-search-input::placeholder { color: rgba(42,42,44,0.55); }

.selected-chips-strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 30px; border-bottom: 1px solid rgba(42,42,44,0.08); }
.selected-chips-strip:empty { display: none; }
.selected-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: #2a2a2c; color: #fff1ed; border-radius: 20px;
  height: 36px; padding: 0 12px 0 10px;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 14px;
  cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.selected-chip-x {
  position: relative; width: 18px; height: 18px; border-radius: 50%;
  background: #fff1ed; color: #1a1a1d;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0; line-height: 1; opacity: 1; flex-shrink: 0;
}
.selected-chip-x::before,
.selected-chip-x::after {
  content: ''; position: absolute; width: 10px; height: 2px;
  border-radius: 2px; background: currentColor;
}
.selected-chip-x::before { transform: rotate(45deg); }
.selected-chip-x::after  { transform: rotate(-45deg); }

.checklist-row {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 16px 30px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.checklist-row::after { content: ''; position: absolute; bottom: 0; left: 30px; right: 30px; height: 1px; background: rgba(42,42,44,0.06); }
.checklist-row:last-child::after { display: none; }
.checklist-row:active { background: rgba(42,42,44,0.03); }
.checklist-label { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 18px; color: #1a1a1d; flex: 1; }
.checklist-row.selected .checklist-label { font-weight: 700; }
.checklist-check { width: 22px; text-align: center; font-size: 14px; flex-shrink: 0; color: rgba(42,42,44,0.18); }
.checklist-row.selected .checklist-check { color: #ed2527; }

/* ── Date picker ── */
.big-cal-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 28px; }
.big-cal-btn { font-size: 30px; color: #1a1a1d; line-height: 1; background: none; border: none; cursor: pointer; padding: 8px; -webkit-tap-highlight-color: transparent; }
.big-cal-btn:active { opacity: 0.5; }
.big-cal-month-display { display: inline-flex; align-items: baseline; gap: 3px; }
.big-cal-month-name { font-family: 'Caravan', sans-serif; font-weight: 900; font-size: 48px; color: #1a1a1d; line-height: 1; letter-spacing: 2px; }
.big-cal-year-badge { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed; font-size: 17px; color: #1a1a1d; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; padding: 0 8px 8px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: rgba(42,42,44,0.32); padding: 0 0 8px; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 400; color: #1a1a1d; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }
.cal-num { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; transition: background 0.1s; }
.cal-day.other-month { color: rgba(42,42,44,0.18); pointer-events: none; }
.cal-day.past { color: rgba(42,42,44,0.28); pointer-events: none; }
.cal-day:not(.past):not(.other-month) { font-weight: 700; }
.cal-day.selected .cal-num { background: #ed2527; color: #fff; font-weight: 700; }
.cal-day:active:not(.other-month):not(.past) .cal-num { background: rgba(42,42,44,0.08); }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: #ed2527; margin-top: 2px; position: relative; z-index: 1; }
.cal-day.selected .cal-dot { background: rgba(255,255,255,0.8); }
.apply-btn-outline {
  width: 100%; height: 64px; background: transparent;
  border: 1.5px solid #1a1a1d; color: #1a1a1d;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 24px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.apply-btn-outline:active { background: rgba(42,42,44,0.05); }
</style>
</head>
<body>
<div class="phone-frame">

  <!-- Main scrollable area: content flows behind sticky glass surface -->
  <div class="content-scroller" id="contentScroller">

  <!-- Single glass surface: header + month — one backdrop-filter -->
  <div class="glass-header">
    <!-- #collapsible wraps header only — collapses on scroll-down -->
    <div id="collapsible">
      <div class="header">
        <div class="header-bar">
          <div class="header-icons-right">
            <button class="icon-btn" aria-label="תפריט">
              <svg width="22" height="16" viewBox="0 0 22 16" fill="none">
                <path d="M2 2h18M2 8h18M2 14h18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="header-divider"></div>
            <button class="icon-btn" aria-label="לוח שנה">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <rect x="2" y="4" width="18" height="16" rx="2" stroke="white" stroke-width="1.6"/>
                <path d="M2 9h18" stroke="white" stroke-width="1.6"/>
                <path d="M7 2v4M15 2v4" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="header-icons-left">
            <button class="icon-btn" aria-label="חיפוש">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <circle cx="10" cy="10" r="7" stroke="white" stroke-width="1.8"/>
                <path d="M16 16L21 21" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="breadcrumb">
          <span>ראשי</span>
          <span class="breadcrumb-sep">›</span>
          <span>לוח ההצגות</span>
        </div>
        <div class="cameri-sidebar">
          <img src="cameri-logo-sidebar.png" alt="הקאמרי">
        </div>
      </div>
    </div><!-- /#collapsible -->
    <div class="month-section">
      <div class="month-track" id="monthTrack"></div>
    </div>
    <!-- Toolbar: between month carousel and content -->
    <div class="toolbar-row" id="toolbarRow">
      <button class="toolbar-btn" id="btnDate">
        <span class="toolbar-content">
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none" style="flex-shrink:0">
            <rect x="2" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M2 9h18" stroke="currentColor" stroke-width="1.7"/>
            <path d="M7 2v4M15 2v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>בחירת תאריך</span>
        </span>
        <span class="toolbar-badge" id="dateBadge"></span>
      </button>
    </div>
    <!-- Sticky day bar — sits inside glass-header so it inherits the blur surface.
         JS updates its text content as the user scrolls past day boundaries. -->
    <div class="day-divider sticky-day-bar" id="stickyDayBar"></div>
  </div><!-- /.glass-header -->

  <!-- Shows list -->
  <div id="showsList" class="shows-list"></div>

  </div><!-- /content-scroller -->

  <!-- Floating filter capsule — centered when at top, collapses to icon-only on left when scrolled -->
  <div class="float-filter" id="btnSinun" role="button" tabindex="0" aria-label="סינון">
    <span class="float-filter-icon">
      <svg width="18" height="14" viewBox="0 0 20 16" fill="none">
        <path d="M1 2h18M4 8h12M7 14h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="float-filter-label">סינון</span>
    <span class="toolbar-badge" id="filterBadge"></span>
    <button class="float-filter-reset" id="btnReset" aria-label="נקה סינון">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M1.5 1.5L13.5 13.5M13.5 1.5L1.5 13.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>
  <div class="date-toast" id="dateToast" aria-live="polite"></div>

  <!-- Drawer X button -->
  <button class="drawer-x-btn" id="drawerXBtn" aria-label="סגור">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 2L14 14M14 2L2 14" stroke="#1a1a1d" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Filter Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-panel" id="drawerMain">
      <div class="drawer-handle-wrap"><div class="drawer-handle"></div></div>
      <div class="drawer-header">
        <span class="drawer-title">מסננים</span>
        <button class="drawer-clear" id="clearBtn" style="visibility:hidden">איפוס</button>
      </div>
      <div class="drawer-body">
        <div class="filter-row" data-panel="panelHatzagot" id="rowHatzagot">
          <div class="filter-row-content">
            <span class="filter-row-label">הצגות</span>
            <span class="filter-row-values" id="valHatzagot"></span>
          </div>
          <span class="filter-row-chevron">‹</span>
        </div>
        <div class="filter-row" data-panel="panelMore" id="rowMore">
          <div class="filter-row-content">
            <span class="filter-row-label">עוד בקאמרי</span>
            <span class="filter-row-values" id="valMore"></span>
          </div>
          <span class="filter-row-chevron">‹</span>
        </div>
        <div class="filter-row" data-panel="panelLangs" id="rowLangs">
          <div class="filter-row-content">
            <span class="filter-row-label">שפת כתוביות</span>
            <span class="filter-row-values" id="valLangs"></span>
          </div>
          <span class="filter-row-chevron">‹</span>
        </div>
      </div>
      <div class="drawer-footer">
        <button class="apply-btn" id="applyBtn" disabled>סינון</button>
      </div>
    </div>

    <div class="drawer-panel" id="panelDates">
      <div class="panel-header">
        <span class="drawer-title">בחירת תאריך</span>
      </div>
      <div class="panel-body">
        <div class="big-cal-nav-row">
          <button class="big-cal-btn" id="bigCalPrev">‹</button>
          <div class="big-cal-month-display">
            <span class="big-cal-month-name" id="bigCalMonthName">מאי</span><span class="big-cal-year-badge" id="bigCalYearBadge">26</span>
          </div>
          <button class="big-cal-btn" id="bigCalNext">›</button>
        </div>
        <div id="bigCalGrid"></div>
      </div>
      <div class="panel-footer">
        <button class="apply-btn-outline" id="applyDatesBtn">אישור</button>
      </div>
    </div>

    <div class="drawer-panel" id="panelHatzagot">
      <div class="panel-header">
        <button class="panel-back" id="backFromHatzagot">›</button>
        <span class="panel-title">הצגות ומופעים</span>
        <button class="panel-clear" id="clearShowsPanelBtn" style="visibility:hidden;pointer-events:none">איפוס</button>
      </div>
      <div class="panel-body">
        <div class="panel-search">
          <input class="panel-search-input" id="showsSearch" type="text" placeholder="חיפוש">
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none" style="flex-shrink:0">
            <circle cx="9.5" cy="9.5" r="7" stroke="rgba(42,42,44,0.55)" stroke-width="1.7"/>
            <path d="M15 15L20 20" stroke="rgba(42,42,44,0.55)" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="selected-chips-strip" id="showsChipsStrip"></div>
        <div id="showsChecklist"></div>
      </div>
      <div class="panel-footer">
        <button class="apply-btn-outline" id="applyHatzagotBtn" disabled>אישור</button>
      </div>
    </div>

    <div class="drawer-panel" id="panelMore">
      <div class="panel-header">
        <button class="panel-back" id="backFromMore">›</button>
        <span class="panel-title">עוד בקאמרי</span>
        <button class="panel-clear" id="clearMorePanelBtn" style="visibility:hidden;pointer-events:none">איפוס</button>
      </div>
      <div class="panel-body">
        <div class="panel-search">
          <input class="panel-search-input" id="moreSearch" type="text" placeholder="חיפוש">
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none" style="flex-shrink:0">
            <circle cx="9.5" cy="9.5" r="7" stroke="rgba(42,42,44,0.55)" stroke-width="1.7"/>
            <path d="M15 15L20 20" stroke="rgba(42,42,44,0.55)" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="selected-chips-strip" id="moreChipsStrip"></div>
        <div id="moreChecklist"></div>
      </div>
      <div class="panel-footer">
        <button class="apply-btn-outline" id="applyMoreBtn" disabled>אישור</button>
      </div>
    </div>

    <div class="drawer-panel" id="panelLangs">
      <div class="panel-header">
        <button class="panel-back" id="backFromLangs">›</button>
        <span class="panel-title">שפת כתוביות</span>
        <span style="width:34px"></span>
      </div>
      <div class="panel-body"><div id="langChecklist"></div></div>
      <div class="panel-footer">
        <button class="apply-btn-outline" id="applyLangsBtn">בחירה</button>
      </div>
    </div>
  </div>

</div><!-- /phone-frame -->

<script>
// ─── Static data ──────────────────────────────────────────────────────────────
const MONTHS   = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOW_NAMES= ["יום א'","יום ב'","יום ג'","יום ד'","יום ה'","יום ו'",'שבת'];
const DOW_HE   = ['א','ב','ג','ד','ה','ו','ש'];
const SUBS_LABELS = {
  'Русский': 'Субтитры\nна русском',
  'English': 'English\nsubtitles',

  'מנדלסון – שיר ללא מילים',

  'בעל זבוב של וויליאם גולדינג',

  'היה או לא היה – חנה רובינא ואלכסנדר פן',
  'יפן',
  'שוברט ושומאן – חלוצי השיר הרומנטי',

  'הודו – פסיפס של ניגודים',
  'פו הדב של א.א. מילן',
  'חגיגה לחושים: פסטיבלים ופולחנים בהודו',
  'רובינזון קרוזו של דניאל דפו',
  'יפן | הסרט "סיפור משפחתי"',
];
const LANGS    = ['עברית','Русский','English'];

const TAG_COLORS = {
  'הצגות הקאמרי':          '#be1e1f',
  'הקאמרי אקדמי':          '#2a3931',
  'פנורמה':                 '#ad7475',
  'קפה ותיאטרון':           '#774930',
  'פסטיבלים ואירועים':       '#8d0f11',
  'הצגות אורחות':           '#306677',
  'הצגות ילדים':            '#924600',
  'מחזות זמר':              '#49005d',
  'מחוות ואירועים ספרותיים':'#671140',
};

const SCHEDULE_TEMPLATES = ALL_SHOWS.filter((show, idx, arr) => arr.findIndex(s => s.title === show.title) === idx);

function seededUnit(month, day, salt = 0) {
  const raw = Math.sin((month + 1) * 928371 + day * 364479 + salt * 19237) * 10000;
  return raw - Math.floor(raw);
}

function targetShowCount(month, day) {
  const r = seededUnit(month, day);
  if (r < 0.08) return 0;
  if (r < 0.35) return 1;
  if (r < 0.67) return 2;
  if (r < 0.90) return 3;
  return 4;
}

function timesForShow(template, month, day, slot) {
  const dow = new Date(2026, month, day).getDay();
  if (template.tag === 'הצגות ילדים') {
    return slot % 2 === 0
      ? [{time: dow === 6 ? '10:30' : '11:00', hall:'הקאמרי 2'}, {time: dow === 6 ? '12:30' : '16:00', hall:'הקאמרי 2'}]
      : [{time: dow === 6 ? '12:00' : '12:30', hall:'הקאמרי 2'}];
  }
  const eveningSets = dow === 5
    ? [['12:00'], ['13:30'], ['15:00'], ['17:30']]
    : [['18:30'], ['19:00'], ['20:30'], ['21:00']];
  const times = eveningSets[slot % eveningSets.length].map(time => ({time, hall:'הקאמרי 1'}));
  if ((day + slot) % 5 === 0) times[0].subtitles = (day + slot) % 10 === 0 ? 'English' : 'Русский';
  return times;
}

function normalizeDailySchedule() {
  const originalByDay = new Map();
  ALL_SHOWS.forEach(show => {
    const key = `${show.month}-${show.day}`;
    if (!originalByDay.has(key)) originalByDay.set(key, []);
    originalByDay.get(key).push(show);
  });

  const scheduledShows = [];
  for (let month = 0; month < 12; month++) {
    const daysInMonth = new Date(2026, month + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      const key = `${month}-${day}`;
      const desiredCount = targetShowCount(month, day);
      const dayShows = [...(originalByDay.get(key) || [])].slice(0, desiredCount);
      const usedTitles = new Set(dayShows.map(show => show.title));

      for (let slot = dayShows.length; slot < desiredCount; slot++) {
        let template = null;
        for (let offset = 0; offset < SCHEDULE_TEMPLATES.length; offset++) {
          const candidate = SCHEDULE_TEMPLATES[(month * 31 + day * 7 + slot * 5 + offset) % SCHEDULE_TEMPLATES.length];
          if (!usedTitles.has(candidate.title)) { template = candidate; break; }
        }
        if (!template) template = SCHEDULE_TEMPLATES[(month + day + slot) % SCHEDULE_TEMPLATES.length];
        usedTitles.add(template.title);

        dayShows.push({
          ...template,
          actors: [...template.actors],
          month,
          day,
          times: timesForShow(template, month, day, slot)
        });
      }

      scheduledShows.push(...dayShows);
    }
  }

  ALL_SHOWS.length = 0;
  ALL_SHOWS.push(...scheduledShows);
}

normalizeDailySchedule();

const monthTrack = document.getElementById('monthTrack');

function buildMonthTrack() {
  const labels = MONTHS.slice().reverse();
  monthTrack.innerHTML = '';
  const lSpacer = document.createElement('div');
  lSpacer.className = 'month-spacer'; lSpacer.id = 'mSpacerL';
  monthTrack.appendChild(lSpacer);
  labels.forEach((label, i) => {
    const realIdx = 11 - i;
    const div = document.createElement('div');
    div.className = 'month-item' + (realIdx === selectedMonth ? ' center' : '');
    div.dataset.idx = realIdx;
    div.innerHTML = `${label}<span class="month-day-badge">${String(CAL_YEAR).slice(2)}</span>`;
    div.addEventListener('click', () => scrollToMonth(realIdx));
    monthTrack.appendChild(div);
  });
  const rSpacer = document.createElement('div');
  rSpacer.className = 'month-spacer'; rSpacer.id = 'mSpacerR';
  monthTrack.appendChild(rSpacer);
  requestAnimationFrame(() => { initSpacersAndScroll(); markCenter(); });
}

function initSpacersAndScroll() {
  const half = monthTrack.offsetWidth / 2;
  document.getElementById('mSpacerL').style.width = half + 'px';
  document.getElementById('mSpacerR').style.width = half + 'px';
  const active = monthTrack.querySelector('.month-item.center');
  if (active) monthTrack.scrollLeft = active.offsetLeft + active.offsetWidth / 2 - half;
}

function markCenter() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    el.classList.toggle('center', el === closest);
  });
}

function getCenterMonthIdx() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  return closest ? +closest.dataset.idx : selectedMonth;
}

function scrollToMonth(m) {
  const item = monthTrack.querySelector(`.month-item[data-idx="${m}"]`);
  if (!item) return;
  const cw = monthTrack.offsetWidth;
  monthTrack.scrollTo({ left: item.offsetLeft + item.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
  requestAnimationFrame(markCenter);
}

let dragDown = false, dragX0 = 0, dragScroll0 = 0;
monthTrack.addEventListener('mousedown', e => {
  dragDown = true; dragX0 = e.pageX; dragScroll0 = monthTrack.scrollLeft;
  monthTrack.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('mouseup', () => {
  if (!dragDown) return; dragDown = false;
  monthTrack.classList.remove('dragging');
  const cw = monthTrack.offsetWidth, mid = monthTrack.scrollLeft + cw / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  if (closest) monthTrack.scrollTo({ left: closest.offsetLeft + closest.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
});
window.addEventListener('mousemove', e => {
  if (!dragDown) return; monthTrack.scrollLeft = dragScroll0 - (e.pageX - dragX0);
});
monthTrack.addEventListener('scroll', () => {
  markCenter();
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const m = getCenterMonthIdx();
    if (m !== selectedMonth) { selectedMonth = m; scrollToMonthInList(m); }
  }, 350);
}, { passive: true });

function getFilteredShows(types, shows, langs, moreEvents = new Set()) {
  let s = [...ALL_SHOWS];
  if (types.size) s = s.filter(x => types.has(x.tag));
  if (shows.size || moreEvents.size) {
    s = s.filter(x => shows.has(x.title) || moreEvents.has(x.title));
  }
  if (langs.size) s = s.filter(x => x.times.some(t => t.subtitles && langs.has(t.subtitles)));
  return s;
}

function buildFeedDays() {
  const days = [];
  for (let m = 0; m < 12; m++) {
    const dim = new Date(CAL_YEAR, m + 1, 0).getDate();
    for (let d = 1; d <= dim; d++) days.push({ month: m, day: d });
  }
  return days;
}

    const dayShows = byDay.get(key) || [];
    return `
    <div class="day-group" data-month="${group.month}" data-day="${group.day}">
      <div class="day-divider">
        <div class="dd-day">${formatDate(group.month, group.day)}</div>
        <div class="day-divider-text">
          <span class="day-divider-sep">|</span>
          <span>${getDowHe(group.month, group.day)}</span>
        </div>
        <div class="dd-rule"></div>
      </div>
      ${dayShows.length ? dayShows.map(s => {
        const hall = s.times[0]?.hall || '';
        return `
        <div class="show-group">
          <div class="show-poster" style="${s.image
            ? `background-image:url('${encodeURI(s.image)}')`
            : `background:${POSTER_BG[s.tag]||'#2a2a2e'}`}"><div class="category-tag" style="background:${TAG_COLORS[s.tag]||'#333'}">${s.tag}</div></div>
          <div class="show-info">
            <div class="show-title-row">
              <div class="show-title">${s.title}</div>
              <div class="show-chevron">&#x2039;</div>
            </div>
            ${hall ? `<div class="show-meta-row">
              <div class="show-meta-item"><span>${hall}</span>${pinSVG}</div>
            </div>` : ''}
            <div class="show-times">${buildTimeBtns(s.times)}</div>
          </div>
        </div>`;
      }).join('') : `<div class="day-empty">אין הצגות ביום זה</div>`}
    </div>`;
  }).join('');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (scrollTarget) scrollToDay(scrollTarget.m, scrollTarget.d, false);
      updateCarouselFromScroll(true);
      if (window._updateStickyDayBar) window._updateStickyDayBar();
    });
  });
}

// ─── Fast smooth scroll helpers ───────────────────────────────────────────────
function fastScrollTo(targetY, container) {
  const start = container.scrollTop;
  const diff  = targetY - start;
  if (Math.abs(diff) < 2) return;
  const duration = Math.min(600, Math.max(250, Math.abs(diff) * 0.5));
  let t0 = null;
  const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  (function step(now) {
    if (!t0) t0 = now;
    const p = Math.min((now - t0) / duration, 1);
    container.scrollTop = start + diff * ease(p);
    if (p < 1) requestAnimationFrame(step);
    else updateCarouselFromScroll();
  })(performance.now());
}

function getGlassH() {
  const gh = document.querySelector('.glass-header');
  return gh ? gh.offsetHeight : 78;
}

function scrollToDay(m, d, animate = true) {
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const group    = list.querySelector(`.day-group[data-month="${m}"][data-day="${d}"]`);
  if (!group) return;
  const divider = group.querySelector('.day-divider');
  const dividerTop = divider ? divider.offsetTop : group.offsetTop;
  const dividerH = divider ? divider.offsetHeight : 0;
  const targetY = Math.max(0, dividerTop + dividerH - getGlassH() + 1);
  if (animate) fastScrollTo(targetY, scroller);
  else scroller.scrollTop = targetY;
}

function scrollToMonthInList(m) {
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const group    = list.querySelector(`.day-group[data-month="${m}"]`);
  if (group) fastScrollTo(Math.max(0, group.offsetTop - getGlassH()), scroller);
}

function getVisibleFeedDate() {
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const scrollTop = scroller.scrollTop + getGlassH() + 80;
  let visible = { month: selectedMonth, day: 1 };
  for (const g of list.querySelectorAll('.day-group')) {
    if (g.offsetTop <= scrollTop) visible = { month: +g.dataset.month, day: +g.dataset.day };
    else break;
  }
  return visible;
}

function dayOfYear(month, day) {
  return Math.floor((new Date(CAL_YEAR, month, day) - new Date(CAL_YEAR, 0, 1)) / 86400000);
}

function getClosestFilteredShowTarget(types, shows, langs, fromDate, moreEvents = new Set()) {
  const filtered = getFilteredShows(types, shows, langs, moreEvents);
  if (!filtered.length) return null;
  const from = dayOfYear(fromDate.month, fromDate.day);
  let best = filtered[0], bestDist = Infinity;
  filtered.forEach(show => {
    const dist = Math.abs(dayOfYear(show.month, show.day) - from);
    if (dist < bestDist) { best = show; bestDist = dist; }
  });
  return { m: best.month, d: best.day };
}

/** Returns the chronologically earliest day that has any filtered show.
 *  Used when filtering by specific shows/events — user wants the FIRST match,
 *  not the closest to their current scroll position. */
function getFirstFilteredShowTarget(types, shows, langs, moreEvents = new Set()) {
  const filtered = getFilteredShows(types, shows, langs, moreEvents);
  if (!filtered.length) return null;
  const matchedKeys = new Set(filtered.map(s => `${s.month}-${s.day}`));
  for (const g of FEED_DAYS) {
    if (matchedKeys.has(`${g.month}-${g.day}`)) return { m: g.month, d: g.day };
  }
  return null;
}

let _carouselSyncLock = false;
function updateCarouselFromScroll(force = false) {
  if (_carouselSyncLock && !force) return;
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const scrollTop = scroller.scrollTop + getGlassH() + 80;
  let visibleMonth = null;
  for (const g of list.querySelectorAll('.day-group')) {
    if (g.offsetTop <= scrollTop) visibleMonth = +g.dataset.month;
    else break;
  }
  if (visibleMonth !== null && visibleMonth !== selectedMonth) {
    selectedMonth = visibleMonth;
    _carouselSyncLock = true;
    scrollToMonth(visibleMonth);
    setTimeout(() => { _carouselSyncLock = false; }, 500);
  }
}

function buildValuesSummary(items, maxPx) {
  if (!items.length) return '';
  const el = document.createElement('span');
  el.style.cssText = 'position:fixed;top:-999px;left:-999px;white-space:nowrap;font-family:FtOrvany,sans-serif;font-size:17px;font-weight:700;font-stretch:semi-condensed';
  document.body.appendChild(el);
  let shown = [];
  for (let i = 0; i < items.length; i++) {
    const candidate = [...shown, items[i]];
    const remaining = items.length - candidate.length;
    el.textContent = candidate.join(' | ') + (remaining > 0 ? ` | +${remaining}` : '');
    if (el.offsetWidth <= maxPx) { shown = candidate; }
    else {
      const ov = items.length - shown.length;
      document.body.removeChild(el);
      return (shown.length ? shown.join(' | ') + ' | ' : '') + `+${ov}`;
    }
  }
  document.body.removeChild(el);
  return shown.join(' | ');
}

// ─── Big calendar ─────────────────────────────────────────────────────────────
function buildBigCalendar() {
  const month = draftCalMonth;
  document.getElementById('bigCalMonthName').textContent = MONTHS[month];
  document.getElementById('bigCalYearBadge').textContent = String(CAL_YEAR).slice(2);
  const daysWithShows = new Set(ALL_SHOWS.filter(s => s.month === month).map(s => s.day));
  const firstDow    = new Date(CAL_YEAR, month, 1).getDay();
  const daysInMonth = new Date(CAL_YEAR, month + 1, 0).getDate();
  const prevDays    = new Date(CAL_YEAR, month, 0).getDate();
  const totalCells  = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  const isPast  = (m, d) => m < TODAY_M || (m === TODAY_M && d < TODAY_D);
  const isToday = (m, d) => m === TODAY_M && d === TODAY_D;
  let cells = '';
  for (let i = 0; i < totalCells; i++) {
    if (i < firstDow) {
      cells += `<div class="cal-day other-month"><span class="cal-num">${prevDays - firstDow + i + 1}</span></div>`;
    } else {
      const d = i - firstDow + 1;
      if (d > daysInMonth) {
        cells += `<div class="cal-day other-month"><span class="cal-num">${d - daysInMonth}</span></div>`;
      } else {
        const has = daysWithShows.has(d), past = isPast(month, d), today = isToday(month, d);
        const cls = ['cal-day', past ? 'past' : (has ? 'has-shows' : ''), today ? 'today' : ''].filter(Boolean).join(' ');
        cells += `<div class="${cls}" data-day="${d}"><span class="cal-num">${d}</span>${today ? '<div class="cal-dot"></div>' : ''}</div>`;
      }
    }
  }
  document.getElementById('bigCalGrid').innerHTML = `<div class="cal-grid">${DOW_HE.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  document.getElementById('bigCalGrid').querySelectorAll('.cal-day:not(.other-month):not(.past)').forEach(el => {
    el.addEventListener('click', () => {
      const d = +el.dataset.day;
      closeDrawer();
      requestAnimationFrame(() => scrollToDay(draftCalMonth, d));
    });
  });
}

// ─── Header + toolbar scroll (glass-header collapsible animation) ─────────────
(function() {
  const scroller    = document.getElementById('contentScroller');
  const glassHeader = document.querySelector('.glass-header');
  const collapsible = document.getElementById('collapsible');
  const toolbar     = document.getElementById('toolbarRow');
  const sidebar     = document.querySelector('.cameri-sidebar');

  const HIDE_MS = 260;
  const SHOW_MS = 160;

  let lastST       = 0;
  let headerHidden = false;
  let _animating   = false;
  let _headerH     = 0;
  let _toolbarH    = 0;
  let _showTimer   = null;
  let _animTimer   = null;

  requestAnimationFrame(() => {
    _headerH  = collapsible.offsetHeight || 94;
    _toolbarH = toolbar.offsetHeight     || 68;
  });

  function hideHeader() {
    if (headerHidden || _animating) return;
    clearTimeout(_animTimer);
    _animating   = true;
    headerHidden = true;

    if (sidebar) { sidebar.style.transition = 'none'; sidebar.style.opacity = '0'; }

    collapsible.style.transition = 'none';
    collapsible.style.height     = (_headerH || 94) + 'px';
    collapsible.style.overflow   = 'hidden';

    toolbar.style.transition = 'none';
    toolbar.style.height     = (_toolbarH || 68) + 'px';
    toolbar.style.overflow   = 'hidden';

    void collapsible.offsetHeight;
    collapsible.style.transition = `height ${HIDE_MS}ms ease`;
    collapsible.style.height     = '0';
    toolbar.style.transition     = `height ${HIDE_MS}ms ease`;
    toolbar.style.height         = '0';

    _animTimer = setTimeout(() => {
      if (headerHidden) toolbar.style.display = 'none';
      _animating = false;
    }, HIDE_MS);
  }

  function showHeader() {
    if (!headerHidden || _animating) return;
    clearTimeout(_animTimer);
    _animating   = true;
    headerHidden = false;

    toolbar.style.display     = 'grid';
    toolbar.style.transition  = 'none';
    toolbar.style.height      = '0';
    toolbar.style.overflow    = 'hidden';

    void collapsible.offsetHeight;
    collapsible.style.transition = `height ${SHOW_MS}ms ease`;
    collapsible.style.height     = (_headerH || 94) + 'px';
    toolbar.style.transition     = `height ${SHOW_MS}ms ease`;
    toolbar.style.height         = (_toolbarH || 68) + 'px';

    _animTimer = setTimeout(() => {
      if (!headerHidden) {
        collapsible.style.height = ''; collapsible.style.overflow = ''; collapsible.style.transition = '';
        toolbar.style.height     = ''; toolbar.style.overflow     = ''; toolbar.style.transition     = ''; toolbar.style.display = '';
        if (sidebar) {
          sidebar.style.transition = 'opacity 120ms ease';
          sidebar.style.opacity    = '';
        }
      }
      _animating = false;
    }, SHOW_MS);
  }

  function resetHeader() {
    clearTimeout(_showTimer);  _showTimer = null;
    clearTimeout(_animTimer);  _animTimer = null;
    _animating   = false;
    headerHidden = false;

    collapsible.style.transition = 'none'; collapsible.style.height = ''; collapsible.style.overflow = '';
    toolbar.style.transition     = 'none'; toolbar.style.height     = ''; toolbar.style.overflow     = ''; toolbar.style.display = '';
    if (sidebar) { sidebar.style.transition = 'none'; sidebar.style.opacity = ''; }

    requestAnimationFrame(() => {
      collapsible.style.transition = '';
      toolbar.style.transition     = '';
      if (sidebar) sidebar.style.transition = '';
    });
  }

  let _rafPending = false;

  scroller.addEventListener('scroll', () => {
    if (_rafPending) return;
    _rafPending = true;

    requestAnimationFrame(() => {
      _rafPending = false;
      const st    = Math.max(0, scroller.scrollTop);
      const delta = st - lastST;
      lastST = st;

      if (Math.abs(delta) < 5 && st > 0) return;

      if (st <= 0) {
        clearTimeout(_showTimer); _showTimer = null;
        resetHeader();
      } else if (delta > 0 && st > 40) {
        clearTimeout(_showTimer); _showTimer = null;
        hideHeader();
      } else if (delta < 0 && headerHidden && !_showTimer) {
        _showTimer = setTimeout(() => { _showTimer = null; showHeader(); }, 200);
      }

      glassHeader.classList.toggle('is-scrolled', st > 10);
      // Floating filter capsule: collapse on scroll-DOWN past 40px,
      // expand on any scroll-UP (matches header's "tiniest scroll-up reveals" rule).
      // Gated on _userScrolled so the init auto-scroll doesn't trigger this.
      if (_userScrolled) {
        const floatFilter = document.getElementById('btnSinun');
        if (floatFilter) {
          if (st <= 0) {
            floatFilter.classList.remove('collapsed');
          } else if (delta > 0 && st > 40) {
            floatFilter.classList.add('collapsed');
          } else if (delta < 0) {
            floatFilter.classList.remove('collapsed');
          }
        }
      }
      updateStickyDayBar();
    });
  }, { passive: true });

  // Sentinel: true after the user has touched, wheeled, or arrow-keyed the list.
  // Programmatic scroll (e.g. init scrollToDay) won't flip this flag.
  let _userScrolled = false;
  const markScrolled = () => { _userScrolled = true; };
  scroller.addEventListener('touchstart', markScrolled, { passive: true, once: true });
  scroller.addEventListener('wheel',      markScrolled, { passive: true, once: true });
  scroller.addEventListener('keydown',    markScrolled, { passive: true, once: true });

  const bar = document.getElementById('stickyDayBar');

  /**
   * Find the topmost day-divider currently scrolled past the glass-header's
   * visible bottom, then clone its children into the sticky bar.
   * When no divider has been scrolled past yet, hide the bar.
   */
  function updateStickyDayBar() {
    if (!bar) return;
    const threshold = glassHeader.getBoundingClientRect().bottom;
    const groups = document.getElementById('showsList').querySelectorAll('.day-group');
    let current = null;
    for (const g of groups) {
      const div = g.querySelector('.day-divider');
      if (!div) continue;
      if (div.getBoundingClientRect().top < threshold) current = div;
      else break;
    }
    if (current) {
      bar.replaceChildren();
      for (const child of current.children) {
        bar.appendChild(child.cloneNode(true));
      }
      bar.style.display = 'flex';
    } else {
      bar.style.display = 'none';
    }
  }

  window._updateStickyDayBar = updateStickyDayBar;
})();

// ─── List scroll → carousel sync ─────────────────────────────────────────────
let _listScrollTimer = null;
document.getElementById('contentScroller').addEventListener('scroll', () => {
  clearTimeout(_listScrollTimer);
  _listScrollTimer = setTimeout(updateCarouselFromScroll, 120);
}, { passive: true });

// ─── Swipe-between-days gesture (touch-only horizontal navigation) ───────────
// Swipe LEFT  → next day (forward chronologically).
// Swipe RIGHT → previous day.
// Uses passive listeners: native vertical scroll continues during the gesture,
// horizontal navigation fires on touchend if motion was confidently horizontal.
(() => {
  const scroller = document.getElementById('contentScroller');
  if (!scroller) return;

  const SWIPE_MIN_DX = 60;     // px: minimum horizontal distance to trigger
  const HV_RATIO_MIN = 1.5;    // horizontal must be > 1.5× vertical
  const MAX_DURATION = 600;    // ms: gesture must complete within this window

  let sx = 0, sy = 0, st = 0;

  scroller.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;  // single-finger only — pinch is not a swipe
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = performance.now();
  }, { passive: true });

  scroller.addEventListener('touchend', (e) => {
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = performance.now() - st;
    if (dt > MAX_DURATION) return;                              // too slow → treat as scroll
    if (Math.abs(dx) < SWIPE_MIN_DX) return;                    // too short → ignore
    if (Math.abs(dx) < Math.abs(dy) * HV_RATIO_MIN) return;     // too vertical → ignore
    jumpToAdjacentDay(dx < 0 ? +1 : -1);
  }, { passive: true });

  function jumpToAdjacentDay(delta) {
    const list = document.getElementById('showsList');
    const glassHeader = document.querySelector('.glass-header');
    if (!list || !glassHeader) return;
    const threshold = glassHeader.getBoundingClientRect().bottom;
    const groups = Array.from(list.querySelectorAll('.day-group'));
    if (!groups.length) return;
    // Find the topmost day-group already scrolled past the visible header.
    let currentIdx = 0;
    for (let i = 0; i < groups.length; i++) {
      const div = groups[i].querySelector('.day-divider');
      const top = (div || groups[i]).getBoundingClientRect().top;
      if (top < threshold + 10) currentIdx = i;
      else break;
    }
    const targetIdx = Math.max(0, Math.min(groups.length - 1, currentIdx + delta));
    if (targetIdx === currentIdx) return;  // already at first/last day — no-op
    const m = parseInt(groups[targetIdx].dataset.month);
    const d = parseInt(groups[targetIdx].dataset.day);
    if (!isNaN(m) && !isNaN(d)) scrollToDay(m, d, true);
  }
})();

// ─── Init ─────────────────────────────────────────────────────────────────────
buildMonthTrack();
renderShows({ m: TODAY_M, d: TODAY_D });
requestAnimationFrame(() => { if (window._updateStickyDayBar) window._updateStickyDayBar(); });
</script>
</body>
</html>
