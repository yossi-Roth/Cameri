<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1d">
<title>לוח הופעות – הקאמרי</title>
<style>
/* ── Caravan display font ── */
@font-face {
  font-family: 'Caravan';
  src: url('fonts/caravan-90-aaa.woff') format('woff');
  font-weight: 900; font-style: normal; font-display: swap;
}
/* ── FtOrvany – Normal ── */
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Thin.otf') format('opentype'); font-weight:100; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLight.otf') format('opentype'); font-weight:200; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Regular.otf') format('opentype'); font-weight:400; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Black.otf') format('opentype'); font-weight:900; font-stretch:normal; font-display:swap; }
/* ── FtOrvany – Condensed ── */
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightCondensed.otf') format('opentype'); font-weight:200; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularCondensed.otf') format('opentype'); font-weight:400; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackCondensed.otf') format('opentype'); font-weight:900; font-stretch:condensed; font-display:swap; }
/* ── FtOrvany – Semi-Condensed ── */
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightSemiCondensed.otf') format('opentype'); font-weight:200; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularSemiCondenced.otf') format('opentype'); font-weight:400; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BoldSemiCondensed.otf') format('opentype'); font-weight:700; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackSemiCondenced.otf') format('opentype'); font-weight:900; font-stretch:semi-condensed; font-display:swap; }
</style>
<style>
:root {
  --bg:        #1a1a1d;
  --bg-card:   #1f1f23;
  --red:       #ed2527;
  --red-hover: #c8102e;
  --text:      #ffffff;
  --text-dim:  #b5b9c6;
  --sep:       #727272;
  --sep-light: #2e2e34;
  --link:      #f8d8cf;
  --tag-h:     24px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  background: #0a0a0c;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 32px 0 64px;
}

/* ── Phone frame ── */
.phone-frame {
  width: 375px; height: 812px;
  background: var(--bg);
  border-radius: 28px;
  box-shadow: 0 32px 96px rgba(0,0,0,0.85), 0 0 0 1px #2a2a2e;
  overflow: hidden; position: relative;
  color: var(--text);
  display: flex; flex-direction: column;
}
@media (max-width: 430px) {
  body { background: var(--bg); padding: 0; }
  .phone-frame { border-radius: 0; box-shadow: none; width: 100%; height: 100vh; }
}

/* ── Cameri sidebar logo ── */
.cameri-sidebar {
  position: absolute; top: 0; right: 0;
  width: 43px; height: 120px;
  z-index: 100; overflow: hidden; line-height: 0;
}
.cameri-sidebar img { width: 43px; height: 120px; display: block; object-fit: cover; }

/* ── Header ── */
.header {
  flex-shrink: 0; position: relative; z-index: 10;
  transition: transform 0.36s cubic-bezier(0.4,0,0.2,1),
              margin-top 0.36s cubic-bezier(0.4,0,0.2,1);
}
.header-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; padding-inline-start: 70px; height: 64px;
}
.header-icons-right { display: flex; align-items: center; gap: 14px; }
.header-icons-left  { display: flex; align-items: center; gap: 2px; }
.header-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }
.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: #fff;
  -webkit-tap-highlight-color: transparent; padding: 0;
}
.breadcrumb {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 8px; padding: 0 20px 12px; padding-inline-start: 70px;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.65);
  flex-shrink: 0;
}
.breadcrumb-sep { font-size: 18px; opacity: 0.5; line-height: 1; }

/* ── Month carousel ── */
.month-section { flex-shrink: 0; position: relative; height: 78px; overflow: hidden; }
.month-track {
  display: flex; align-items: center;
  overflow-x: scroll; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  direction: ltr; cursor: grab; height: 78px;
}
.month-track.dragging { cursor: grabbing; scroll-snap-type: none; }
.month-track::-webkit-scrollbar { display: none; }
.month-spacer { flex-shrink: 0; }
.month-item {
  scroll-snap-align: center; flex-shrink: 0;
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0 16px;
  font-family: 'Caravan', sans-serif; font-size: 48px; font-weight: 900;
  color: #4b4b4b; letter-spacing: 5.4px;
  cursor: pointer; user-select: none; white-space: nowrap; transition: color 0.18s;
}
.month-item.center { color: #fff; }
.month-day-badge {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed;
  font-size: 19px; letter-spacing: 0; color: rgba(255,255,255,0.82); margin-bottom: 2px;
}

.active-chip {
  display: none;
  -webkit-tap-highlight-color: transparent; transition: opacity 0.12s;
}
.active-chip:active { opacity: 0.6; }
.chip-x { font-size: 15px; line-height: 1; color: rgba(255,255,255,0.4); margin-top: -1px; }

/* ── Shows list ── */
.shows-list {
  flex: 1; overflow-y: auto;
  padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  scrollbar-width: none; transition: opacity 0.28s;
}
.shows-list::-webkit-scrollbar { display: none; }
.shows-list.fading { opacity: 0.12; pointer-events: none; }

/* ── Show card ── */
.show-card {
  display: flex; flex-direction: row; align-items: stretch;
  gap: 14px; padding: 24px 30px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.14s;
  position: relative;
}
.show-card::after {
  content: ''; position: absolute; bottom: 0; left: 30px; right: 30px;
  height: 1px; background: rgba(255,255,255,0.1);
}
.show-card:last-child::after { display: none; }
.show-card:active { background: rgba(255,255,255,0.025); }
.show-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.show-top-row { display: flex; align-items: center; width: 100%; }
.category-tag {
  display: inline-flex; align-items: center; height: var(--tag-h);
  padding: 2px 8px 1px;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 15px; letter-spacing: 0.4px; color: #fff1ed; white-space: nowrap; flex-shrink: 0;
}
/* ── Day divider ── */
.day-divider {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding: 11px 20px;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 18px; color: #ffffff; letter-spacing: 0.3px;
  white-space: nowrap;
}
.day-divider::before,
.day-divider::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.18);
}

.show-title {
  font-family: 'Caravan', sans-serif; font-weight: 900;
  font-size: 24px; color: #fff; line-height: 1.15;
  text-align: right; width: 100%; letter-spacing: 0.5px;
}
.show-desc {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 15px; color: rgba(255,255,255,0.82); line-height: 1.35;
  text-align: right; width: 100%;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.show-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 17px; color: var(--link); letter-spacing: 0.72px;
  cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent;
}
.show-link svg { flex-shrink: 0; }
.show-poster {
  width: 96px; flex-shrink: 0; border-radius: 2px; overflow: hidden;
  background-size: cover; background-position: center top; min-height: 110px;
  background-color: #1a1a1a;
}
.no-results {
  padding: 56px 30px; text-align: center; color: var(--text-dim); font-size: 15px; line-height: 1.6;
}
.no-results strong { display: block; color: var(--text); font-size: 18px; font-weight: 700; margin-bottom: 8px; }

/* ── Toolbar row (סינון + תאריך) ── */
.toolbar-row {
  flex-shrink: 0; display: flex; gap: 12px; padding: 14px 20px 10px;
  transition: transform 0.36s cubic-bezier(0.4,0,0.2,1),
              margin-top 0.36s cubic-bezier(0.4,0,0.2,1);
}
.toolbar-btn {
  flex: 1; height: 52px; border-radius: 100px;
  background: #454545; border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 18px; letter-spacing: 0.72px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
  position: relative;
}
.toolbar-btn:active { background: #5a5a5a; }
.toolbar-badge {
  position: absolute; top: -7px; right: 10px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--red);
  display: none;
  pointer-events: none;
  border: 2.5px solid #454545;
}
.toolbar-reset {
  flex: none; width: 52px; background: #454545;
}


/* ── Overlay ── */
.overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.68);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 110;
}
.overlay.visible { opacity: 1; pointer-events: all; }

/* ══════════════════════════════════════════
   DRAWER SHELL
══════════════════════════════════════════ */
.drawer {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 80%; border-radius: 30px 30px 0 0; z-index: 120;
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1),
              height 0.36s cubic-bezier(0.32, 0.72, 0, 1);
}
.drawer.open { transform: translateY(0); }
.drawer.date-mode { height: 72%; }
/* Hide the confirm button and handle in date mode — tap a day to close */
.drawer.date-mode #panelDates .panel-footer { display: none; }
.drawer.date-mode .drawer-handle-wrap { display: none; }

/* ══════════════════════════════════════════
   PANELS
══════════════════════════════════════════ */
.drawer-panel {
  position: absolute; inset: 0; background: #fff1ed;
  display: flex; flex-direction: column;
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
#drawerMain { transform: translateX(0); }
#panelDates, #panelShows, #panelActors, #panelTypes, #panelLangs { transform: translateX(-100%); }
.panel-out { transform: translateX(100%)  !important; }
.panel-in  { transform: translateX(0)     !important; }

/* ── Main panel header ── */
.drawer-handle-wrap { padding: 14px 0 8px; display: flex; justify-content: center; flex-shrink: 0; }
.drawer-handle { width: 56px; height: 6px; background: #1a1a1d; opacity: 0.7; border-radius: 3px; }
.drawer-header {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  padding: 4px 24px 18px; flex-shrink: 0;
}
.drawer-title {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: #1a1a1d;
}
.drawer-clear {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(42,42,44,0.4);
  background: none; border: none; cursor: pointer;
  padding: 4px 0; -webkit-tap-highlight-color: transparent;
}
.drawer-clear:active { color: #ed2527; }
.drawer-body { overflow-y: auto; flex: 1; scrollbar-width: none; }
.drawer-body::-webkit-scrollbar { display: none; }

/* ── Drilldown rows ── */
.filter-row {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  min-height: 80px; padding: 0 24px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.filter-row::after {
  content: ''; position: absolute; bottom: 0; left: 24px; right: 24px;
  height: 1px; background: rgba(42,42,44,0.1);
}
.filter-row:active { background: rgba(42,42,44,0.04); }
.filter-row-content { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex: 1; min-width: 0; }
.filter-row-label {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 22px; color: #1a1a1d;
  transition: font-size 0.18s ease, color 0.18s ease, font-weight 0.18s ease;
}
.filter-row.active .filter-row-label {
  font-size: 13px; font-weight: 400; color: rgba(42,42,44,0.5);
}
.filter-row-values {
  display: none; overflow: hidden; white-space: nowrap;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 17px; color: #1a1a1d;
}
.filter-row.active .filter-row-values { display: block; }
.filter-row-chevron { font-size: 22px; color: rgba(42,42,44,0.38); flex-shrink: 0; line-height: 1; margin-right: 14px; display: inline-block; direction: ltr; unicode-bidi: isolate; }

/* ── Drawer close (X) button ── */
.drawer-x-btn {
  position: absolute; left: 50%;
  bottom: calc(80% + 20px);   /* filter mode: floats above drawer */
  transform: translateX(-50%) translateY(16px);
  width: 56px; height: 56px; border-radius: 50%;
  background: #fff; border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 130;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, bottom 0.36s cubic-bezier(0.32,0.72,0,1),
              transform 0.36s cubic-bezier(0.32,0.72,0,1);
  -webkit-tap-highlight-color: transparent;
}
.drawer-x-btn.open {
  opacity: 1; pointer-events: all;
  transform: translateX(-50%) translateY(0);
}
/* Date mode: float clearly above the shorter drawer */
.drawer-x-btn.date-mode { bottom: calc(72% + 22px); }

/* ── Inline sections ── */
.filter-inline-section { position: relative; padding: 20px 24px 24px; }
.filter-inline-section::after {
  content: ''; position: absolute; bottom: 0; left: 24px; right: 24px;
  height: 1px; background: rgba(42,42,44,0.1);
}
.filter-inline-title {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 22px; color: #1a1a1d; margin-bottom: 14px;
}
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.type-chip {
  height: 36px; padding: 0 18px; border-radius: 70px;
  border: 1px solid #2a2a2c; background: transparent; color: #2a2a2c;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 15px;
  cursor: pointer; transition: all 0.12s; -webkit-tap-highlight-color: transparent;
  white-space: nowrap; display: inline-flex; align-items: center;
}
.type-chip.selected { background: #2a2a2c; color: #fff1ed; border-color: #2a2a2c; }
.type-chip:active { opacity: 0.7; }
.lang-inline-row { display: flex; justify-content: space-around; }
.lang-inline-item {
  display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 0;
  -webkit-tap-highlight-color: transparent;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: #1a1a1d;
}
.lang-inline-item.selected { font-weight: 700; }
.lang-check-icon { font-size: 13px; color: rgba(42,42,44,0.18); }
.lang-inline-item.selected .lang-check-icon { color: #ed2527; }

/* ── Drawer footer / apply button ── */
.drawer-footer { flex-shrink: 0; padding: 12px 20px 28px; }
.drawer-footer .apply-btn { border-radius: 0; }
.apply-btn {
  width: 100%; height: 64px; background: #ed2527; color: #fff;
  border: none; border-radius: 0;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 24px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.apply-btn:active { background: #c8102e; }

/* ══════════════════════════════════════════
   SUB-PANEL COMPONENTS
══════════════════════════════════════════ */
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 16px; flex-shrink: 0;
  border-bottom: 1px solid rgba(42,42,44,0.1);
}
.panel-back {
  font-size: 26px; line-height: 1; color: #1a1a1d;
  background: none; border: none; cursor: pointer;
  padding: 0 4px; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  unicode-bidi: isolate; direction: ltr;
}
.panel-title {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 22px; color: #1a1a1d; flex: 1; text-align: center;
}
.panel-clear {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 15px; color: rgba(42,42,44,0.4);
  background: none; border: none; cursor: pointer;
  padding: 4px 0; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.panel-clear:active { color: #ed2527; }
.panel-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
.panel-body::-webkit-scrollbar { display: none; }
.panel-footer { flex-shrink: 0; padding: 12px 20px 28px; }

/* Search bar */
.panel-search {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 28px 30px 14px; direction: rtl;
}
.panel-search::after {
  content: ''; position: absolute; bottom: 0; left: 30px; right: 30px;
  height: 1.5px; background: #1a1a1d;
}
.panel-search-input {
  flex: 1; border: none; outline: none;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 17px; color: #1a1a1d; background: transparent; text-align: right; direction: rtl;
}
.panel-search-input::placeholder { color: rgba(42,42,44,0.55); }

/* Selected chips strip */
.selected-chips-strip {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 30px;
  border-bottom: 1px solid rgba(42,42,44,0.08);
}
.selected-chips-strip:empty { display: none; }
.selected-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: #2a2a2c; color: #fff1ed; border-radius: 20px; padding: 5px 10px 5px 12px;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 14px;
  cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.selected-chip-x { font-size: 15px; opacity: 0.6; }

/* Checklist rows */
.checklist-row {
  position: relative; display: flex; align-items: center;
  gap: 10px;
  padding: 16px 30px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.checklist-row::after {
  content: ''; position: absolute; bottom: 0; left: 30px; right: 30px;
  height: 1px; background: rgba(42,42,44,0.06);
}
.checklist-row:last-child::after { display: none; }
.checklist-row:active { background: rgba(42,42,44,0.03); }
.checklist-label {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 18px; color: #1a1a1d; flex: 1;
}
.checklist-row.selected .checklist-label { font-weight: 700; }
.checklist-check { width: 22px; text-align: center; font-size: 14px; flex-shrink: 0; color: rgba(42,42,44,0.18); }
.checklist-row.selected .checklist-check { color: #ed2527; }

/* ══════════════════════════════════════════
   DATE PICKER PANEL
══════════════════════════════════════════ */
.big-cal-nav-row {
  display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 28px;
}
.big-cal-btn {
  font-size: 30px; color: rgba(42,42,44,0.32); line-height: 1;
  background: none; border: none; cursor: pointer; padding: 8px; -webkit-tap-highlight-color: transparent;
}
.big-cal-btn:active { color: #1a1a1d; }
.big-cal-month-display { display: inline-flex; align-items: baseline; gap: 3px; }
.big-cal-month-name {
  font-family: 'Caravan', sans-serif; font-weight: 900; font-size: 48px;
  color: #1a1a1d; line-height: 1; letter-spacing: 2px;
}
.big-cal-year-badge {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed;
  font-size: 17px; color: #1a1a1d;
}
/* Calendar grid */
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; padding: 0 8px 8px;
}
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: rgba(42,42,44,0.32); padding: 0 0 8px; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 14px; font-weight: 400; color: #1a1a1d;
  cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent;
}
.cal-num {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1; transition: background 0.1s;
}
.cal-day.other-month { color: rgba(42,42,44,0.18); pointer-events: none; }
.cal-day.past { color: rgba(42,42,44,0.28); pointer-events: none; }
.cal-day:not(.past):not(.other-month) { font-weight: 700; }
.cal-day.selected .cal-num { background: #ed2527; color: #fff; font-weight: 700; }
.cal-day:active:not(.other-month):not(.past) .cal-num { background: rgba(42,42,44,0.08); }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: #ed2527; margin-top: 2px; position: relative; z-index: 1; }
.cal-day.selected .cal-dot { background: rgba(255,255,255,0.8); }
.apply-btn-outline {
  width: 100%; height: 64px; background: transparent;
  border: 1.5px solid #1a1a1d; border-radius: 0;
  color: #1a1a1d;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 24px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.apply-btn-outline:active { background: rgba(42,42,44,0.05); }
</style>

function getDowHe(month, day) { return DOW_NAMES[new Date(CAL_YEAR, month, day).getDay()]; }

// ─── Month carousel ───────────────────────────────────────────────────────────
const monthTrack = document.getElementById('monthTrack');

function buildMonthTrack() {
  const labels = MONTHS.slice().reverse();
  monthTrack.innerHTML = '';
  const lSpacer = document.createElement('div');
  lSpacer.className = 'month-spacer'; lSpacer.id = 'mSpacerL';
  monthTrack.appendChild(lSpacer);
  labels.forEach((label, i) => {
    const realIdx = 11 - i;
    const div = document.createElement('div');
    div.className = 'month-item' + (realIdx === selectedMonth ? ' center' : '');
    div.dataset.idx = realIdx;
    if (realIdx === selectedMonth && realIdx === TODAY_M) {
      div.innerHTML = `${label}<span class="month-day-badge">${TODAY_D}</span>`;
    } else { div.textContent = label; }
    div.addEventListener('click', () => scrollToMonth(realIdx));
    monthTrack.appendChild(div);
  });
  const rSpacer = document.createElement('div');
  rSpacer.className = 'month-spacer'; rSpacer.id = 'mSpacerR';
  monthTrack.appendChild(rSpacer);
  requestAnimationFrame(() => { initSpacersAndScroll(); markCenter(); });
}

function initSpacersAndScroll() {
  const half = monthTrack.offsetWidth / 2;
  document.getElementById('mSpacerL').style.width = half + 'px';
  document.getElementById('mSpacerR').style.width = half + 'px';
  const active = monthTrack.querySelector('.month-item.center');
  if (active) monthTrack.scrollLeft = active.offsetLeft + active.offsetWidth / 2 - half;
}

function markCenter() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const active = el === closest;
    el.classList.toggle('center', active);
    const idx = +el.dataset.idx;
    if (active && idx === TODAY_M && !el.querySelector('.month-day-badge')) {
      el.innerHTML = `${MONTHS[idx]}<span class="month-day-badge">${TODAY_D}</span>`;
    } else if (!active && el.querySelector('.month-day-badge')) {
      el.textContent = MONTHS[idx];
    }
  });
}

function getCenterMonthIdx() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  return closest ? +closest.dataset.idx : selectedMonth;
}

function scrollToMonth(m) {
  const item = monthTrack.querySelector(`.month-item[data-idx="${m}"]`);
  if (!item) return;
  const cw = monthTrack.offsetWidth;
  monthTrack.scrollTo({ left: item.offsetLeft + item.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
  requestAnimationFrame(markCenter);
}

// Mouse drag
let dragDown = false, dragX0 = 0, dragScroll0 = 0;
monthTrack.addEventListener('mousedown', e => {
  dragDown = true; dragX0 = e.pageX; dragScroll0 = monthTrack.scrollLeft;
  monthTrack.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('mouseup', () => {
  if (!dragDown) return; dragDown = false;
  monthTrack.classList.remove('dragging');
  const cw = monthTrack.offsetWidth, mid = monthTrack.scrollLeft + cw / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  if (closest) monthTrack.scrollTo({ left: closest.offsetLeft + closest.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
});
window.addEventListener('mousemove', e => {
  if (!dragDown) return; monthTrack.scrollLeft = dragScroll0 - (e.pageX - dragX0);
});

monthTrack.addEventListener('scroll', () => {
  markCenter();
  clearTimeout(debounceTimer);
  document.getElementById('showsList').classList.add('fading');
  debounceTimer = setTimeout(() => {
    const m = getCenterMonthIdx();
    if (m !== selectedMonth) { selectedMonth = m; activeRangeStart = null; activeRangeEnd = null; }
    updateBadge(); renderShows();
    document.getElementById('showsList').classList.remove('fading');
  }, 800);
}, { passive: true });

// ─── Shows ────────────────────────────────────────────────────────────────────
function getFilteredShows(month, rStart, rEnd, types, shows, actors) {
  let s = ALL_SHOWS.filter(x => x.month === month);
  if (rStart && rEnd)  s = s.filter(x => x.day >= rStart && x.day <= rEnd);
  else if (rStart)     s = s.filter(x => x.day === rStart);
  if (types.size)  s = s.filter(x => types.has(x.tag));
  if (shows.size)  s = s.filter(x => shows.has(x.title));
  if (actors.size) s = s.filter(x => x.actors.some(a => actors.has(a)));
  return s;
}

function renderShows() {
  const list  = document.getElementById('showsList');
  const shows = getFilteredShows(selectedMonth, activeRangeStart, activeRangeEnd, activeTypes, activeShows, activeActors);
  if (!shows.length) {
    list.innerHTML = `<div class="no-results"><strong>לא נמצאו הצגות</strong>נסה לשנות את הפילטרים הנבחרים</div>`;
    return;
  }

  // Group by day
  const byDay = [];
  let lastDay = null;
  shows.forEach(s => {
    if (s.day !== lastDay) {
      byDay.push({ day: s.day, month: s.month, shows: [] });
      lastDay = s.day;
    }
    byDay[byDay.length - 1].shows.push(s);
  });

  list.innerHTML = byDay.map(group => `
    <div class="day-group">
      <div class="day-divider">${getDowHe(group.month, group.day)} | ${formatDate(group.month, group.day)}</div>
      ${group.shows.map(s => `
        <div class="show-card">
          <div class="show-poster" style="${s.image?`background-image:url('${encodeURI(s.image)}')`:`background:${POSTER_BG[s.tag]||'#222'}`}"></div>
          <div class="show-info">
            <div class="show-top-row">
              <div class="category-tag" style="background:${TAG_COLORS[s.tag]||'#333'}">${s.tag}</div>
            </div>
            <div class="show-title">${s.title}</div>
            <div class="show-link">פרטים וכרטיסים ${LINK_ARROW}</div>
          </div>
        </div>`).join('')}
    </div>`).join('');
}

// ─── Values summary (measures text width, adds +N overflow) ───────────────────
function buildValuesSummary(items, maxPx) {
  if (!items.length) return '';
  const el = document.createElement('span');
  el.style.cssText = 'position:fixed;top:-999px;left:-999px;white-space:nowrap;' +
    'font-family:FtOrvany,sans-serif;font-size:17px;font-weight:700;font-stretch:semi-condensed';
  document.body.appendChild(el);
  let shown = [];
  for (let i = 0; i < items.length; i++) {
    const candidate = [...shown, items[i]];
    const remaining = items.length - candidate.length;
    el.textContent = candidate.join(' | ') + (remaining > 0 ? ` | +${remaining}` : '');
    if (el.offsetWidth <= maxPx) {
      shown = candidate;
    } else {
      const ov = items.length - shown.length;
      document.body.removeChild(el);
      return (shown.length ? shown.join(' | ') + ' | ' : '') + `+${ov}`;
    }
  }
  document.body.removeChild(el);
  return shown.join(' | ');
}

// ─── Big calendar ─────────────────────────────────────────────────────────────
function buildBigCalendar() {
  const month = draftCalMonth;
  document.getElementById('bigCalMonthName').textContent = MONTHS[month];
  document.getElementById('bigCalYearBadge').textContent = String(CAL_YEAR).slice(2);

  const daysWithShows = new Set(ALL_SHOWS.filter(s => s.month === month).map(s => s.day));
  const firstDow    = new Date(CAL_YEAR, month, 1).getDay();
  const daysInMonth = new Date(CAL_YEAR, month + 1, 0).getDate();
  const prevDays    = new Date(CAL_YEAR, month, 0).getDate();
  const totalCells  = Math.ceil((firstDow + daysInMonth) / 7) * 7;

  // Past = before today's date (comparing month+day)
  const isPast = (m, d) => m < TODAY_M || (m === TODAY_M && d < TODAY_D);
  const isToday = (m, d) => m === TODAY_M && d === TODAY_D;

  let cells = '';
  for (let i = 0; i < totalCells; i++) {
    if (i < firstDow) {
      cells += `<div class="cal-day other-month"><span class="cal-num">${prevDays - firstDow + i + 1}</span></div>`;
    } else {
      const d = i - firstDow + 1;
      if (d > daysInMonth) {
        cells += `<div class="cal-day other-month"><span class="cal-num">${d - daysInMonth}</span></div>`;
      } else {
        const has      = daysWithShows.has(d);
        const past     = isPast(month, d);
        const today    = isToday(month, d);
        const selected = draftRangeStart === d;
        const cls = ['cal-day',
          past ? 'past' : (has ? 'has-shows' : ''),
          today    ? 'today'    : '',
          selected ? 'selected' : ''
        ].filter(Boolean).join(' ');
        const dot = today ? '<div class="cal-dot"></div>' : '';
        cells += `<div class="${cls}" data-day="${d}">
          <span class="cal-num">${d}</span>${dot}
        </div>`;
      }
    }
  }

  document.getElementById('bigCalGrid').innerHTML = `
    <div class="cal-grid">
      ${DOW_HE.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>`;

  document.getElementById('bigCalGrid').querySelectorAll('.cal-day:not(.other-month):not(.past)').forEach(el => {
    el.addEventListener('click', () => {
      const d = +el.dataset.day;
      if (drawerMode === 'date') {
        // Immediately commit and close — no confirm button
        activeCalMonth   = draftCalMonth;
        activeRangeStart = d;
        activeRangeEnd   = null;
        draftRangeStart  = d;
        updateBadge(); renderShows();
        closeDrawer();
      } else {
        draftRangeStart = (draftRangeStart === d) ? null : d;
        draftRangeEnd   = null;
        buildBigCalendar(); updateMainDrawerBadges();
      }
    });
  });
}

// ─── Drawer open / close ───────────────────────────────────────────────────────
const drawer  = document.getElementById('drawer');
const overlay = document.getElementById('overlay');

function openDrawer(mode) {
  drawerMode = mode || 'filters';
  draftCalMonth   = activeCalMonth || selectedMonth;
  draftRangeStart = activeRangeStart;
  draftRangeEnd   = activeRangeEnd;
  draftTypes      = new Set(activeTypes);
  draftShows      = new Set(activeShows);
  draftActors     = new Set(activeActors);
  draftLangs      = new Set(activeLangs);
  updateMainDrawerBadges(); updateApplyBtn();
  // Reset all panels directly (goBackToMain has drawerMode logic, avoid calling it here)
  document.getElementById('drawerMain').classList.remove('panel-out');
  ['panelDates','panelShows','panelActors','panelTypes','panelLangs'].forEach(id =>
    document.getElementById(id).classList.remove('panel-in'));
  const isDate = drawerMode === 'date';
  drawer.classList.add('open');
  drawer.classList.toggle('date-mode', isDate);
  overlay.classList.add('visible');
  drawerXBtn.classList.add('open');
  drawerXBtn.classList.toggle('date-mode', isDate);
  if (isDate) {
    buildBigCalendar();
    requestAnimationFrame(() => openPanel('panelDates'));
  }
}

const drawerXBtn = document.getElementById('drawerXBtn');

function closeDrawer() {
  drawer.classList.remove('open', 'date-mode');
  overlay.classList.remove('visible');
  drawerXBtn.classList.remove('open', 'date-mode');
}

});

document.getElementById('clearBtn').addEventListener('click', () => {
  draftTypes=new Set(); draftShows=new Set(); draftActors=new Set(); draftLangs=new Set();
  updateMainDrawerBadges(); updateApplyBtn();
});

// ─── Header + Toolbar scroll-aware behavior ───────────────────────────────────
(function() {
  const header  = document.querySelector('.header');
  const toolbar = document.getElementById('toolbarRow');
  const list    = document.getElementById('showsList');
  let lastST       = 0;
  let headerVisible  = true;
  let toolbarVisible = true;

  function hideHeader() {
    if (!headerVisible) return;
    headerVisible = false;
    const h = header.offsetHeight;
    header.style.marginTop = `-${h}px`;
    header.style.transform = `translateY(-${h}px)`;
  }
  function showHeader() {
    if (headerVisible) return;
    headerVisible = true;
    header.style.marginTop = '0';
    header.style.transform = 'translateY(0)';
  }
  function hideToolbar() {
    if (!toolbarVisible) return;
    toolbarVisible = false;
    const h = toolbar.offsetHeight;
    toolbar.style.marginTop = `-${h}px`;
    toolbar.style.transform = `translateY(-${h}px)`;
  }
  function showToolbar() {
    if (toolbarVisible) return;
    toolbarVisible = true;
    toolbar.style.marginTop = '0';
    toolbar.style.transform = 'translateY(0)';
  }

  list.addEventListener('scroll', () => {
    const st    = list.scrollTop;
    const delta = st - lastST;
    lastST = st <= 0 ? 0 : st;
    if (delta > 4 && st > 40) {
      hideHeader();
      hideToolbar();
    } else if (delta < -4) {
      showHeader();
      showToolbar();
    }
  }, { passive: true });
})();

// ─── Init ─────────────────────────────────────────────────────────────────────
buildMonthTrack();
renderShows();
</script>
