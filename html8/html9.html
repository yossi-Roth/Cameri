<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1d">
<title>לוח הופעות – הקאמרי (9)</title>
<style>
@font-face { font-family:'Caravan'; src:url('fonts/caravan-90-aaa.woff') format('woff'); font-weight:900; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Thin.otf') format('opentype'); font-weight:100; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLight.otf') format('opentype'); font-weight:200; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Regular.otf') format('opentype'); font-weight:400; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-Black.otf') format('opentype'); font-weight:900; font-stretch:normal; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightCondensed.otf') format('opentype'); font-weight:200; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularCondensed.otf') format('opentype'); font-weight:400; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackCondensed.otf') format('opentype'); font-weight:900; font-stretch:condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-ExtraLightSemiCondensed.otf') format('opentype'); font-weight:200; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-RegularSemiCondenced.otf') format('opentype'); font-weight:400; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BoldSemiCondensed.otf') format('opentype'); font-weight:700; font-stretch:semi-condensed; font-display:swap; }
@font-face { font-family:'FtOrvany'; src:url('fonts/FtOrvany0.69-BlackSemiCondenced.otf') format('opentype'); font-weight:900; font-stretch:semi-condensed; font-display:swap; }
</style>
<style>
:root {
  --bg:        #1a1a1d;
  --red:       #ed2527;
  --red-hover: #c8102e;
  --text:      #ffffff;
  --sep:       #727272;
  --sep-dark:  #454545;
  --link:      #f8d8cf;
  --tag-h:     27px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  background: #0a0a0c;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 32px 0 64px;
}

/* ── Phone frame ── */
.phone-frame {
  width: 375px; height: 812px;
  background: var(--bg);
  border-radius: 28px;
  box-shadow: 0 32px 96px rgba(0,0,0,0.85), 0 0 0 1px #2a2a2e;
  overflow: hidden; position: relative;
  color: var(--text);
  display: flex; flex-direction: column;
}
@media (max-width: 430px) {
  body { background: var(--bg); padding: 0; }
  .phone-frame { border-radius: 0; box-shadow: none; width: 100%; height: 100vh; }
}

/* ── Cameri sidebar logo ── */
.cameri-sidebar {
  position: absolute; top: 0; right: 0;
  width: 43px; height: 120px;
  z-index: 100; overflow: hidden; line-height: 0;
}
.cameri-sidebar img { width: 43px; height: 120px; display: block; object-fit: cover; }

/* ── Header — lives inside .glass-header, inherits its blur ── */
.header { position: relative; }
.header-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; padding-inline-start: 70px; height: 64px;
}
.header-icons-right { display: flex; align-items: center; gap: 14px; }
.header-icons-left  { display: flex; align-items: center; gap: 2px; }
.header-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }
.icon-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: #fff;
  -webkit-tap-highlight-color: transparent; padding: 0;
}
.breadcrumb {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 8px; padding: 0 20px 12px; padding-inline-start: 70px;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.65);
  flex-shrink: 0;
}
.breadcrumb-sep { font-size: 18px; opacity: 0.5; line-height: 1; }

/* ── Month carousel ── */
/* Single blurred glass surface — wraps month + day bar as one unit */
.glass-header {
  position: sticky; top: 0; z-index: 9;
}
/* Blur + tint live on a pseudo-element so the mask fades the blur itself */
.glass-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  background: rgba(26,26,29,0.82);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
}
/* Fade starts right below glass surface, flows into content */
.glass-header::after {
  content: '';
  position: absolute;
  top: 100%; left: 0; right: 0;
  height: 44px;
  background: linear-gradient(to bottom, rgba(26,26,29,0.70) 0%, transparent 100%);
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.12s ease;
}
.glass-header:not(.is-scrolled)::after { opacity: 0; }
.month-section { flex-shrink: 0; height: 78px; overflow: hidden; }
.month-track {
  display: flex; align-items: center;
  overflow-x: scroll; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  direction: ltr; cursor: grab; height: 78px;
}
.month-track.dragging { cursor: grabbing; scroll-snap-type: none; }
.month-track::-webkit-scrollbar { display: none; }
.month-spacer { flex-shrink: 0; }
.month-item {
  scroll-snap-align: center; flex-shrink: 0;
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 0 16px; direction: rtl;
  font-family: 'Caravan', sans-serif; font-size: 48px; font-weight: 900;
  color: #4b4b4b; letter-spacing: 5.4px;
  cursor: pointer; user-select: none; white-space: nowrap; transition: color 0.18s;
}
.month-item.center { color: #fff; }
.month-day-badge {
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: condensed;
  font-size: 19px; letter-spacing: 0; color: rgba(255,255,255,0.82); margin-bottom: 2px;
  opacity: 0; transition: opacity 0.18s ease;
}
.month-item.center .month-day-badge { opacity: 1; }

/* ── Toolbar ── */
.toolbar-row {
  flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px; padding: 14px 20px 10px;
  /* No position/z-index here — a stacking context would break the parent's
     backdrop-filter in WebKit, making toolbar edges visible while scrolling */
  background: transparent;
}
.toolbar-btn {
  flex: 1 1 0; min-width: 0; box-sizing: border-box;
  width: 100%;
  height: 44px; border-radius: 100px;
  background: #454545; border: none; color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 18px; letter-spacing: 0.72px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
  position: relative;
}
.toolbar-btn:active { background: #5a5a5a; }
.toolbar-badge {
  position: absolute; top: -7px; left: 10px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--red); display: none;
  pointer-events: none; border: 2.5px solid #454545;
}
/* Keep the filter indicator physically on the left edge in RTL. */
#btnSinun .toolbar-badge {
  left: 10px;
  right: auto;
}
.filter-capsule {
  padding-inline: 12px;
}
.toolbar-content {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  transition: transform 0.15s ease;
}
.filter-capsule .toolbar-content {
  flex-direction: row-reverse;
}
.filter-capsule.has-reset .toolbar-content {
  transform: translateX(18px);
}
.toolbar-reset {
  position: absolute;
  left: 5px;
  top: 5px;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.toolbar-reset:active { background: var(--red-hover); }
.toolbar-reset svg { width: 14px; height: 14px; }

/* ── Shows list ── */
.content-scroller {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  min-height: 0; scrollbar-width: none; position: relative;
}
.content-scroller::-webkit-scrollbar { display: none; }
.shows-list {
  padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  transition: opacity 0.28s;
}
.shows-list.fading { opacity: 0.12; pointer-events: none; }

/* ── Floating sticky day bar — lives inside .glass-header, inherits blur ── */
.sticky-day-bar {
  pointer-events: none;
  visibility: hidden;
  display: none;
  /* Reduce initial gap under toolbar by 18px (11+11 -> 2+2). */
  padding-top: 2px;
  padding-bottom: 2px;
}
.day-divider.sticky-day-bar { background: transparent; }
.sticky-day-bar .day-divider-line { background: rgba(255,255,255,0.18); }

/* ── Day divider (inline, not sticky) ── */
.day-divider {
  background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding: 11px 26px;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 22px; color: #ffffff; letter-spacing: 0.3px;
  white-space: nowrap;
}
.day-divider-line {
  flex: 1; height: 1px; background: #ffffff;
}
.day-divider-text { display: flex; align-items: center; gap: 10px; }
.day-divider-sep {
  font-weight: 400; font-stretch: normal; font-size: 20px;
  opacity: 0.6; line-height: 1;
}

/* ── Show group ── */
/* ── Show card — vertical layout ── */
.show-group {
  display: flex; flex-direction: column;
  padding: 16px 26px 25px;
  gap: 12px;
  position: relative;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.14s;
}
.day-group .show-group { margin-bottom: 18px; }
.day-group .show-group:last-child { margin-bottom: 0; }
.day-group .show-group:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 26px;
  right: 26px;
  bottom: -5px;
  height: 1px;
  background: #454545;
}
.show-group:active { background: rgba(255,255,255,0.025); }

/* Category tag — absolute over the poster top-right */
.category-tag {
  position: absolute; top: 16px; right: 26px; z-index: 2;
  display: inline-flex; align-items: center; height: var(--tag-h);
  padding: 3px 10px 2px;
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 13px; letter-spacing: 0.4px; color: #fff1ed; white-space: nowrap;
}

/* Full-width landscape poster */
.show-poster {
  width: 100%; height: 228px; background: #2a2a2c; overflow: hidden; flex-shrink: 0;
}
.show-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Text content */
.show-details {
  display: flex; flex-direction: column; gap: 5px;
  padding: 0;
}
.show-meta {
  display: flex; align-items: center; gap: 6px; height: 22px;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 18px; color: #fff; letter-spacing: 0.36px; white-space: nowrap;
}
.show-meta span:first-child {
  font-weight: 600;
  font-size: 20px;
}
.show-meta span:last-child {
  font-weight: 600;
  font-size: 20px;
}
.show-meta-sep { opacity: 0.45; }
.show-title {
  font-family: 'Caravan', sans-serif; font-weight: 900;
  font-size: 28px; color: #fff; line-height: 1.1;
  text-align: right; letter-spacing: 1px;
}
.show-desc {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 18px; line-height: 22px; color: rgba(255,255,255,0.75); text-align: right;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* ── CTA button — full width ── */
.show-cta {
  width: 100%; height: 48px;
  background: var(--red); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 18px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.show-cta:active { background: var(--red-hover); }

/* ── No results ── */
.no-results {
  padding: 48px 30px 56px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.no-results-img {
  width: 140px; height: 140px; object-fit: contain; margin-bottom: 28px;
}
.no-results-title {
  font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed;
  font-size: 20px; color: var(--text); line-height: 1.35; margin-bottom: 10px;
}
.no-results-sub {
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.5;
}
.day-empty {
  margin: 8px 26px 24px;
  min-height: 72px;
  border: 0 none rgba(0,0,0,0);
  border-image: none;
  border-radius: 16px;
  background-color: unset;
  background: unset;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 700;
  font-stretch: semi-condensed;
  font-size: 18px;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.2px;
}

/* ══════════════════════════════════════════
   OVERLAY + DRAWER
══════════════════════════════════════════ */
.overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.68);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 110;
}
.overlay.visible { opacity: 1; pointer-events: all; }

.date-toast {
  position: absolute;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(12px);
  background: rgba(26,26,29,0.94);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-family: 'FtOrvany', sans-serif;
  font-weight: 700;
  font-stretch: semi-condensed;
  font-size: 15px;
  line-height: 1;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 150;
  white-space: nowrap;
}
.date-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.drawer {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 80%; border-radius: 30px 30px 0 0; z-index: 120;
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1),
              height 0.36s cubic-bezier(0.32, 0.72, 0, 1);
}
.drawer.open { transform: translateY(0); }
.drawer.date-mode { height: 72%; }
.drawer.date-mode #panelDates .panel-footer { display: none; }
.drawer.date-mode .drawer-handle-wrap { display: none; }

.drawer-panel {
  position: absolute; inset: 0; background: #fff1ed;
  display: flex; flex-direction: column;
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
#drawerMain { transform: translateX(0); }
#panelDates, #panelShows, #panelActors, #panelTypes, #panelLangs { transform: translateX(-100%); }
.panel-out { transform: translateX(100%) !important; }
.panel-in  { transform: translateX(0)   !important; }

.drawer-handle-wrap { padding: 14px 0 8px; display: flex; justify-content: center; flex-shrink: 0; }
.drawer-handle { width: 56px; height: 6px; background: #1a1a1d; opacity: 0.7; border-radius: 3px; }

.drawer-header {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  padding: 4px 24px 18px; flex-shrink: 0;
}
.drawer-title { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 16px; color: #1a1a1d; }
.drawer-clear { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 16px; color: #2a2a2c; background: none; border: none; cursor: pointer; padding: 4px 0; -webkit-tap-highlight-color: transparent; }
.drawer-clear:active { color: #ed2527; }
.drawer-body { overflow-y: auto; flex: 1; scrollbar-width: none; }
.drawer-body::-webkit-scrollbar { display: none; }

.filter-row {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  min-height: 80px; padding: 0 24px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
}
.filter-row::after { content: ''; position: absolute; bottom: 0; left: 24px; right: 24px; height: 1px; background: rgba(42,42,44,0.2); }
.filter-row:active { background: rgba(42,42,44,0.04); }
.filter-row-content { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex: 1; min-width: 0; }
.filter-row-label { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed; font-size: 22px; color: #1a1a1d; transition: font-size 0.18s, color 0.18s, font-weight 0.18s; }
.filter-row.active .filter-row-label { font-size: 14px; font-weight: 400; color: rgba(42,42,44,0.56); }
.filter-row-values { display: none; overflow: hidden; white-space: nowrap; font-family: 'FtOrvany', sans-serif; font-weight: 700; font-stretch: semi-condensed; font-size: 17px; color: #1a1a1d; }
.filter-row.active .filter-row-values { display: block; }
.filter-row-chevron { font-size: 22px; color: rgba(42,42,44,0.56); flex-shrink: 0; line-height: 1; margin-right: 14px; display: inline-block; direction: ltr; unicode-bidi: isolate; }

.drawer-x-btn {
  position: absolute; left: 50%;
  bottom: calc(80% + 20px);
  transform: translateX(-50%) translateY(16px);
  width: 56px; height: 56px; border-radius: 50%;
  background: #fff; border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 130;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, bottom 0.36s cubic-bezier(0.32,0.72,0,1), transform 0.36s cubic-bezier(0.32,0.72,0,1);
  -webkit-tap-highlight-color: transparent;
}
.drawer-x-btn.open { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
.drawer-x-btn.date-mode { bottom: calc(72% + 22px); }

.drawer-footer { flex-shrink: 0; padding: 12px 20px 28px; }
.apply-btn {
  width: 100%; height: 64px; background: #ed2527; color: #fff;
  border: none; font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed;
  font-size: 24px; letter-spacing: 0.5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.apply-btn:active { background: #c8102e; }
.apply-btn:disabled,
.apply-btn-outline:disabled {
  opacity: 0.28;
  cursor: default;
  pointer-events: none;
}

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 16px; flex-shrink: 0;
  border-bottom: 1px solid rgba(42,42,44,0.1);
}
.panel-back { font-size: 26px; line-height: 1; color: #1a1a1d; background: none; border: none; cursor: pointer; padding: 0 4px; -webkit-tap-highlight-color: transparent; flex-shrink: 0; unicode-bidi: isolate; direction: ltr; }
.panel-title { font-family: 'FtOrvany', sans-serif; font-weight: 900; font-stretch: semi-condensed; font-size: 22px; color: #1a1a1d; flex: 1; text-align: center; }
.panel-clear { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 15px; color: #2a2a2c; background: none; border: none; cursor: pointer; padding: 4px 0; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.panel-clear:active { color: #ed2527; }
.panel-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
.panel-body::-webkit-scrollbar { display: none; }
.panel-footer { flex-shrink: 0; padding: 12px 20px 28px; }

.panel-search {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 28px 30px 14px; direction: rtl;
}
.panel-search::after { content: ''; position: absolute; bottom: 0; left: 30px; right: 30px; height: 1.5px; background: #1a1a1d; }
.panel-search-input {
  flex: 1; border: none; outline: none;
  font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed;
  font-size: 17px; color: #1a1a1d; background: transparent; text-align: right; direction: rtl;
}
.panel-search-input::placeholder { color: rgba(42,42,44,0.55); }

.selected-chips-strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 30px; border-bottom: 1px solid rgba(42,42,44,0.08); }

.selected-chip {

  opacity: 1; flex-shrink: 0;

.checklist-row {

}
.checklist-row::after { content: ''; position: absolute; bottom: 0; left: 30px; right: 30px; height: 1px; background: rgba(42,42,44,0.06); }
.checklist-row:last-child::after { display: none; }
.checklist-row:active { background: rgba(42,42,44,0.03); }
.checklist-label { font-family: 'FtOrvany', sans-serif; font-weight: 400; font-stretch: semi-condensed; font-size: 18px; color: #1a1a1d; flex: 1; }
.checklist-row.selected .checklist-label { font-weight: 700; }
.checklist-check { width: 22px; text-align: center; font-size: 14px; flex-shrink: 0; color: rgba(42,42,44,0.18); }
.checklist-row.selected .checklist-check { color: #ed2527; }

/* ── Date picker ── */
.big-cal-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 28px; }
.big-cal-btn { font-size: 30px; color: #1a1a1d; line-height: 1; background: none; border: none; cursor: pointer; padding: 8px; -webkit-tap-highlight-color: transparent; }
.big-cal-btn:active { opacity: 0.5; }
.big-cal-month-display { display: inline-flex; align-items: baseline; gap: 3px; }
.big-cal-month-name { font-family: 'Caravan', sans-serif; font-weight: 900; font-size: 48px; color: #1a1a1d; line-height: 1; letter-spacing: 2px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; padding: 0 8px 8px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: rgba(42,42,44,0.32); padding: 0 0 8px; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 400; color: #1a1a1d; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; }

const SCHEDULE_TEMPLATES = ALL_SHOWS.filter((show, idx, arr) => arr.findIndex(s => s.title === show.title) === idx);

function seededUnit(month, day, salt = 0) {
  const raw = Math.sin((month + 1) * 928371 + day * 364479 + salt * 19237) * 10000;
  return raw - Math.floor(raw);
}

function targetShowCount(month, day) {
  const r = seededUnit(month, day);
  if (r < 0.08) return 0;
  if (r < 0.35) return 1;
  if (r < 0.67) return 2;
  if (r < 0.90) return 3;
  return 4;
}

function timesForShow(template, month, day, slot) {
  const dow = new Date(2026, month, day).getDay();
  if (template.tag === 'הצגות ילדים') {
    return slot % 2 === 0
      ? [{time: dow === 6 ? '10:30' : '11:00'}, {time: dow === 6 ? '12:30' : '16:00'}]
      : [{time: dow === 6 ? '12:00' : '12:30'}];
  }

  const eveningSets = dow === 5
    ? [['12:00'], ['13:30'], ['15:00'], ['17:30']]
    : [['18:30'], ['19:00'], ['20:30'], ['21:00']];
  const times = eveningSets[slot % eveningSets.length].map(time => ({time}));
  if ((day + slot) % 5 === 0) times[0].subtitles = (day + slot) % 10 === 0 ? 'English' : 'Русский';
  return times;
}

function normalizeDailySchedule() {
  const originalByDay = new Map();
  ALL_SHOWS.forEach(show => {
    const key = `${show.month}-${show.day}`;
    if (!originalByDay.has(key)) originalByDay.set(key, []);
    originalByDay.get(key).push(show);
  });

  const scheduledShows = [];
  for (let month = 0; month < 12; month++) {
    const daysInMonth = new Date(2026, month + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
      const key = `${month}-${day}`;
      const desiredCount = targetShowCount(month, day);
      const dayShows = [...(originalByDay.get(key) || [])].slice(0, desiredCount);
      const usedTitles = new Set(dayShows.map(show => show.title));

      for (let slot = dayShows.length; slot < desiredCount; slot++) {
        let template = null;
        for (let offset = 0; offset < SCHEDULE_TEMPLATES.length; offset++) {
          const candidate = SCHEDULE_TEMPLATES[(month * 31 + day * 7 + slot * 5 + offset) % SCHEDULE_TEMPLATES.length];
          if (!usedTitles.has(candidate.title)) { template = candidate; break; }
        }
        if (!template) template = SCHEDULE_TEMPLATES[(month + day + slot) % SCHEDULE_TEMPLATES.length];
        usedTitles.add(template.title);

        dayShows.push({
          ...template,
          actors: [...template.actors],
          month,
          day,
          times: timesForShow(template, month, day, slot)
        });
      }

      scheduledShows.push(...dayShows);
    }
  }

  ALL_SHOWS.length = 0;
  ALL_SHOWS.push(...scheduledShows);
}

normalizeDailySchedule();

function buildMonthTrack() {

function initSpacersAndScroll() {
  const half = monthTrack.offsetWidth / 2;
  document.getElementById('mSpacerL').style.width = half + 'px';
  document.getElementById('mSpacerR').style.width = half + 'px';
  const active = monthTrack.querySelector('.month-item.center');
  if (active) monthTrack.scrollLeft = active.offsetLeft + active.offsetWidth / 2 - half;
}

function markCenter() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    el.classList.toggle('center', el === closest);
  });
}

function getCenterMonthIdx() {
  const mid = monthTrack.scrollLeft + monthTrack.offsetWidth / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  return closest ? +closest.dataset.idx : selectedMonth;
}

function scrollToMonth(m) {
  const item = monthTrack.querySelector(`.month-item[data-idx="${m}"]`);
  if (!item) return;
  const cw = monthTrack.offsetWidth;
  monthTrack.scrollTo({ left: item.offsetLeft + item.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
  requestAnimationFrame(markCenter);
}

let dragDown = false, dragX0 = 0, dragScroll0 = 0;
monthTrack.addEventListener('mousedown', e => {
  dragDown = true; dragX0 = e.pageX; dragScroll0 = monthTrack.scrollLeft;
  monthTrack.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('mouseup', () => {
  if (!dragDown) return; dragDown = false;
  monthTrack.classList.remove('dragging');
  const cw = monthTrack.offsetWidth, mid = monthTrack.scrollLeft + cw / 2;
  let closest = null, minDist = Infinity;
  monthTrack.querySelectorAll('.month-item').forEach(el => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; closest = el; }
  });
  if (closest) monthTrack.scrollTo({ left: closest.offsetLeft + closest.offsetWidth / 2 - cw / 2, behavior: 'smooth' });
});
window.addEventListener('mousemove', e => {
  if (!dragDown) return; monthTrack.scrollLeft = dragScroll0 - (e.pageX - dragX0);
});

// ─── Fast smooth scroll helpers ───────────────────────────────────────────────
function fastScrollTo(targetY, container) {
  const start = container.scrollTop;
  const diff  = targetY - start;
  if (Math.abs(diff) < 2) return;
  const duration = Math.min(600, Math.max(250, Math.abs(diff) * 0.5));
  let t0 = null;
  const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  (function step(now) {
    if (!t0) t0 = now;
    const p = Math.min((now - t0) / duration, 1);
    container.scrollTop = start + diff * ease(p);
    if (p < 1) requestAnimationFrame(step);
    else updateCarouselFromScroll();
  })(performance.now());
}

function getGlassH() {
  const gh = document.querySelector('.glass-header');
  return gh ? gh.offsetHeight : 78;
}

function scrollToDay(m, d, animate = true) {
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const group    = list.querySelector(`.day-group[data-month="${m}"][data-day="${d}"]`);
  if (!group) return;
  const divider = group.querySelector('.day-divider');
  const dividerTop = divider ? divider.offsetTop : group.offsetTop;
  const dividerH = divider ? divider.offsetHeight : 0;
  const targetY = Math.max(0, dividerTop + dividerH - getGlassH() + 1);
  if (animate) fastScrollTo(targetY, scroller);
  else scroller.scrollTop = targetY;
}

function scrollToMonthInList(m) {
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const group    = list.querySelector(`.day-group[data-month="${m}"]`);
  if (group) fastScrollTo(Math.max(0, group.offsetTop - getGlassH()), scroller);
}

function getVisibleFeedDate() {
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const scrollTop = scroller.scrollTop + getGlassH() + 80;
  let visible = { month: selectedMonth, day: 1 };
  for (const g of list.querySelectorAll('.day-group')) {
    if (g.offsetTop <= scrollTop) visible = { month: +g.dataset.month, day: +g.dataset.day };
    else break;
  }
  return visible;
}

function dayOfYear(month, day) {
  return Math.floor((new Date(CAL_YEAR, month, day) - new Date(CAL_YEAR, 0, 1)) / 86400000);
}

function getClosestFilteredShowTarget(types, shows, actors, langs, fromDate) {
  const filtered = getFilteredShows(types, shows, actors, langs);
  if (!filtered.length) return null;

  const from = dayOfYear(fromDate.month, fromDate.day);
  let best = filtered[0], bestDist = Infinity;
  filtered.forEach(show => {
    const dist = Math.abs(dayOfYear(show.month, show.day) - from);
    if (dist < bestDist) { best = show; bestDist = dist; }
  });
  return { m: best.month, d: best.day };
}

let _carouselSyncLock = false;
function updateCarouselFromScroll(force = false) {
  if (_carouselSyncLock && !force) return;
  const scroller = document.getElementById('contentScroller');
  const list     = document.getElementById('showsList');
  const scrollTop = scroller.scrollTop + getGlassH() + 80;
  let visibleMonth = null;
  for (const g of list.querySelectorAll('.day-group')) {
    if (g.offsetTop <= scrollTop) visibleMonth = +g.dataset.month;
    else break;
  }
  if (visibleMonth !== null && visibleMonth !== selectedMonth) {
    selectedMonth = visibleMonth;
    _carouselSyncLock = true;
    scrollToMonth(visibleMonth);
    setTimeout(() => { _carouselSyncLock = false; }, 500);
  }
}

function buildValuesSummary(items, maxPx) {
  if (!items.length) return '';
  const el = document.createElement('span');
  el.style.cssText = 'position:fixed;top:-999px;left:-999px;white-space:nowrap;font-family:FtOrvany,sans-serif;font-size:17px;font-weight:700;font-stretch:semi-condensed';
  document.body.appendChild(el);
  let shown = [];
  for (let i = 0; i < items.length; i++) {
    const candidate = [...shown, items[i]];
    const remaining = items.length - candidate.length;
    el.textContent = candidate.join(' | ') + (remaining > 0 ? ` | +${remaining}` : '');
    if (el.offsetWidth <= maxPx) { shown = candidate; }
    else {
      const ov = items.length - shown.length;
      document.body.removeChild(el);
      return (shown.length ? shown.join(' | ') + ' | ' : '') + `+${ov}`;
    }
  }
  document.body.removeChild(el);
  return shown.join(' | ');
}

// ─── Big calendar ─────────────────────────────────────────────────────────────
function buildBigCalendar() {
  const month = draftCalMonth;
  document.getElementById('bigCalMonthName').textContent = MONTHS[month];
  document.getElementById('bigCalYearBadge').textContent = String(CAL_YEAR).slice(2);
  const daysWithShows = new Set(ALL_SHOWS.filter(s => s.month === month).map(s => s.day));
  const firstDow    = new Date(CAL_YEAR, month, 1).getDay();
  const daysInMonth = new Date(CAL_YEAR, month + 1, 0).getDate();
  const prevDays    = new Date(CAL_YEAR, month, 0).getDate();
  const totalCells  = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  const isPast  = (m, d) => m < TODAY_M || (m === TODAY_M && d < TODAY_D);
  const isToday = (m, d) => m === TODAY_M && d === TODAY_D;
  let cells = '';
  for (let i = 0; i < totalCells; i++) {
    if (i < firstDow) {
      cells += `<div class="cal-day other-month"><span class="cal-num">${prevDays - firstDow + i + 1}</span></div>`;
    } else {
      const d = i - firstDow + 1;
      if (d > daysInMonth) {
        cells += `<div class="cal-day other-month"><span class="cal-num">${d - daysInMonth}</span></div>`;
      } else {
        const has = daysWithShows.has(d), past = isPast(month, d), today = isToday(month, d);
        const cls = ['cal-day', past ? 'past' : (has ? 'has-shows' : ''), today ? 'today' : ''].filter(Boolean).join(' ');
        cells += `<div class="${cls}" data-day="${d}"><span class="cal-num">${d}</span>${today ? '<div class="cal-dot"></div>' : ''}</div>`;
      }
    }
  }
  document.getElementById('bigCalGrid').innerHTML = `<div class="cal-grid">${DOW_HE.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  document.getElementById('bigCalGrid').querySelectorAll('.cal-day:not(.other-month):not(.past)').forEach(el => {
    el.addEventListener('click', () => {
      const d = +el.dataset.day;
      closeDrawer();
      requestAnimationFrame(() => scrollToDay(draftCalMonth, d));
    });
  });
}

// ─── Panel navigation ─────────────────────────────────────────────────────────
function openPanel(panelId) {
  document.getElementById('drawerMain').classList.add('panel-out');
  document.getElementById(panelId).classList.add('panel-in');
}
function goBackToMain() {
  if (drawerMode === 'date') { closeDrawer(); return; }
  document.getElementById('drawerMain').classList.remove('panel-out');
  ['panelDates','panelShows','panelActors','panelTypes','panelLangs'].forEach(id => document.getElementById(id).classList.remove('panel-in'));
}

document.querySelectorAll('.filter-row[data-panel]').forEach(row => {
  row.addEventListener('click', () => {
    const id = row.dataset.panel;
    openPanel(id);
    if (id === 'panelDates') buildBigCalendar();
    if (id === 'panelShows') buildShowsPanel();

});

// ─── Header + toolbar scroll + floating day bar ───────────────────────────────
(function() {
  const scroller    = document.getElementById('contentScroller');
  const list        = document.getElementById('showsList');
  const bar         = document.getElementById('stickyDayBar');
  const barText     = document.getElementById('stickyDayText');
  const glassHeader = document.querySelector('.glass-header');
  // #collapsible = header row only. toolbar animates separately but simultaneously.
  const collapsible = document.getElementById('collapsible');
  const toolbar     = document.getElementById('toolbarRow');
  const sidebar     = document.querySelector('.cameri-sidebar');

  const HIDE_MS = 260;
  const SHOW_MS = 160;

  let lastST       = 0;
  let headerHidden = false;
  let _animating   = false;
  let _headerH     = 0;   // collapsible natural height, captured once
  let _toolbarH    = 0;   // toolbar natural height, captured once
  let _showTimer   = null;
  let _animTimer   = null;

  // Measure both elements once after first paint — never during animation
  requestAnimationFrame(() => {
    _headerH  = collapsible.offsetHeight || 94;
    _toolbarH = toolbar.offsetHeight     || 76;
  });

  function hideHeader() {
    if (headerHidden || _animating) return;

    clearTimeout(_animTimer);
    _animating   = true;
    headerHidden = true;

    if (sidebar) { sidebar.style.transition = 'none'; sidebar.style.opacity = '0'; }

    // Collapsible (header): lock → reflow → animate to 0
    collapsible.style.transition = 'none';
    collapsible.style.height     = (_headerH || 94) + 'px';
    collapsible.style.overflow   = 'hidden';

    // Toolbar: lock → same reflow → animate to 0
    toolbar.style.transition = 'none';
    toolbar.style.height     = (_toolbarH || 76) + 'px';
    toolbar.style.overflow   = 'hidden';

    void collapsible.offsetHeight; // single reflow covers both
    collapsible.style.transition = `height ${HIDE_MS}ms ease`;
    collapsible.style.height     = '0';
    toolbar.style.transition     = `height ${HIDE_MS}ms ease`;
    toolbar.style.height         = '0';

    _animTimer = setTimeout(() => {
      // display:none after animation — eliminates any sub-pixel bleed from capsule edges
      if (headerHidden) toolbar.style.display = 'none';
      _animating = false;
    }, HIDE_MS);
  }

  function showHeader() {
    if (!headerHidden || _animating) return;

    clearTimeout(_animTimer);
    _animating   = true;
    headerHidden = false;

    // Bring toolbar back from display:none at height 0, then animate open
    toolbar.style.display     = 'grid';
    toolbar.style.transition  = 'none';
    toolbar.style.height      = '0';
    toolbar.style.overflow    = 'hidden';

    void collapsible.offsetHeight; // reflow so height:0 is committed before animation
    collapsible.style.transition = `height ${SHOW_MS}ms ease`;
    collapsible.style.height     = (_headerH || 94) + 'px';
    toolbar.style.transition     = `height ${SHOW_MS}ms ease`;
    toolbar.style.height         = (_toolbarH || 76) + 'px';

    _animTimer = setTimeout(() => {
      if (!headerHidden) {
        collapsible.style.height = ''; collapsible.style.overflow = ''; collapsible.style.transition = '';
        toolbar.style.height     = ''; toolbar.style.overflow     = ''; toolbar.style.transition     = ''; toolbar.style.display = '';
        if (sidebar) {
          sidebar.style.transition = 'opacity 120ms ease';
          sidebar.style.opacity    = '';
        }
      }
      _animating = false;
    }, SHOW_MS);
  }

  function resetHeader() {
    clearTimeout(_showTimer);  _showTimer = null;
    clearTimeout(_animTimer);  _animTimer = null;
    _animating   = false;
    headerHidden = false;

    collapsible.style.transition = 'none'; collapsible.style.height = ''; collapsible.style.overflow = '';
    toolbar.style.transition     = 'none'; toolbar.style.height     = ''; toolbar.style.overflow     = ''; toolbar.style.display = '';
    if (sidebar) { sidebar.style.transition = 'none'; sidebar.style.opacity = ''; }

    requestAnimationFrame(() => {
      collapsible.style.transition = '';
      toolbar.style.transition     = '';
      if (sidebar) sidebar.style.transition = '';
    });
  }

  function updateStickyDayBar() {
    const ghH = glassHeader ? glassHeader.offsetHeight : 78;
    const st  = scroller.scrollTop;
    let current = null;
    for (const d of list.querySelectorAll('.day-divider')) {
      if (d.offsetTop < st + ghH) current = d;
      else break;
    }
    if (current) {
      barText.innerHTML = current.querySelector('.day-divider-text').innerHTML;
      bar.style.display = 'flex';
      bar.style.visibility = 'visible';
    } else {
      bar.style.visibility = 'hidden';
      bar.style.display = 'none';
    }
  }

  let _rafPending = false;

  scroller.addEventListener('scroll', () => {
    if (_rafPending) return;
    _rafPending = true;
    requestAnimationFrame(() => {
      _rafPending = false;
      const st    = Math.max(0, scroller.scrollTop);
      const delta = st - lastST;
      lastST = st;

      if (st <= 0) {
        clearTimeout(_showTimer); _showTimer = null;
        resetHeader();
      } else if (delta > 0 && st > 40) {
        // Only hide after 40 px of scroll — prevents shaking from small bounces near the top
        clearTimeout(_showTimer); _showTimer = null;
        hideHeader();
      } else if (delta < 0 && headerHidden && !_showTimer) {
        // Scrolling up — 200 ms suspension before bringing header back
        _showTimer = setTimeout(() => { _showTimer = null; showHeader(); }, 200);
      }

      glassHeader.classList.toggle('is-scrolled', st > 10);
      updateStickyDayBar();
    });
  }, { passive: true });

  window._updateStickyDayBar = updateStickyDayBar;
})();

// ─── List scroll → carousel sync ─────────────────────────────────────────────
let _listScrollTimer = null;
document.getElementById('contentScroller').addEventListener('scroll', () => {
  clearTimeout(_listScrollTimer);
  _listScrollTimer = setTimeout(updateCarouselFromScroll, 120);
}, { passive: true });

// ─── Init ─────────────────────────────────────────────────────────────────────
buildMonthTrack();
renderShows({ m: TODAY_M, d: TODAY_D });
</script>
